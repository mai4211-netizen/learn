<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Speaking 考前开口版</title><style>body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#f5f1e8;color:#202321;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:560px;padding:28px;text-align:center}.small{color:#6b706c;font-size:14px}.progress{height:6px;background:#ded8cc;border-radius:999px;overflow:hidden;margin:18px 0}.bar{height:100%;width:0;background:#375d50;transition:width .2s}.error{color:#a33;white-space:pre-wrap}.retry{display:none;margin:16px auto 0;border:0;border-radius:10px;background:#202321;color:white;padding:10px 16px;font:inherit;cursor:pointer}</style></head><body><div class="box"><h1>正在加载复习材料…</h1><p class="small" id="status">正在载入学习卡片与本轮录音。</p><div class="progress"><div class="bar" id="bar"></div></div><p id="err" class="error"></p><button class="retry" id="retry">重新加载</button></div><script>async function boot(){const title=document.querySelector('h1'),status=document.getElementById('status'),err=document.getElementById('err'),bar=document.getElementById('bar'),retry=document.getElementById('retry');try{retry.style.display='none';err.textContent='';title.textContent='正在加载复习材料…';const names=['batch-payload-1.txt','batch-payload-2.txt','batch-payload-3.txt','batch-payload-4.txt','batch-payload-5.txt'];const arrays=[];for(let i=0;i<names.length;i++){status.textContent=`正在读取资源 ${i+1}/${names.length}…`;const r=await fetch(names[i]+'?v=5',{cache:'no-store'});if(!r.ok)throw new Error(names[i]+' 加载失败（HTTP '+r.status+'）');let text=(await r.text()).replace(/[^A-Za-z0-9+/=]/g,'');if(!text)throw new Error(names[i]+' 内容为空');const firstEq=text.indexOf('=');if(firstEq>=0)text=text.slice(0,firstEq)+text.slice(firstEq).replace(/[^=]/g,'');while(text.length%4)text+='=';let binary;try{binary=atob(text)}catch(e){throw new Error(names[i]+' 数据解码失败')};const bytes=new Uint8Array(binary.length);for(let j=0;j<binary.length;j++)bytes[j]=binary.charCodeAt(j);arrays.push(bytes);bar.style.width=((i+1)/names.length*70)+'%'}const total=arrays.reduce((n,a)=>n+a.length,0),raw=new Uint8Array(total);let offset=0;for(const a of arrays){raw.set(a,offset);offset+=a.length}if(!('DecompressionStream'in window))throw new Error('浏览器版本过旧，不支持页面解压，请升级浏览器');status.textContent='正在解压页面…';bar.style.width='85%';const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text();if(!html.includes('<html')||!html.includes('学习卡片'))throw new Error('页面数据校验失败');bar.style.width='100%';document.open();document.write(html);document.close()}catch(e){title.textContent='页面加载失败';status.textContent='没有修改你的录音或本轮练习数据。';err.textContent=e.message;retry.style.display='inline-block'}}document.getElementById('retry').onclick=boot;boot();</script></body></html>
