<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Speaking｜考前开口版</title>
<style>
:root{--paper:#f5f1e8;--ink:#202321;--muted:#6b706c;--card:#fffdf8;--line:#d8d2c5;--red:#b94b43;--green:#375d50;--gold:#b08343;--blue:#506b7a;--shadow:0 14px 38px rgba(42,44,40,.08)}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.65}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(980px,calc(100% - 32px));margin:auto;padding:42px 0 90px}.hero{border-bottom:1px solid var(--line);padding:18px 0 32px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--red);font-weight:800}.hero h1{font:500 clamp(38px,7vw,72px)/1 Georgia,"Songti SC",serif;letter-spacing:-.04em;margin:12px 0 16px}.hero p{margin:0;max-width:760px;color:var(--muted)}.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:12px}.stat b{font-size:20px;margin-right:5px}.bad{color:#9b322d}.tabs{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px;margin:18px 0 12px;background:rgba(245,241,232,.96);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}.tabs button,.view button,.filters button,.actions button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;color:var(--ink)}.tabs button{border-radius:10px;font-weight:800}.tabs button.active,.view button.active,.filters button.active,.actions button.active{background:var(--green);color:#fff;border-color:var(--green)}.controls{position:sticky;top:66px;z-index:15;background:rgba(245,241,232,.97);backdrop-filter:blur(10px);padding:8px 0 12px;border-bottom:1px solid var(--line)}.searchrow{display:flex;gap:8px}.searchrow input{min-width:0;flex:1;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px}.searchrow button{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:0 14px}.view,.filters,.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.view button,.filters button,.actions button{font-size:12px;padding:5px 10px}.filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}.filters button{flex:0 0 auto}.source{font-size:12px;color:var(--muted);margin:9px 2px 0}.cards{display:flex;flex-direction:column;gap:14px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow);scroll-margin-top:225px}.card-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.num{font:italic 18px Georgia,serif;color:var(--red);margin-right:8px}.topic{display:inline-block;background:#e0ebe5;color:var(--green);font-size:11px;border-radius:999px;padding:3px 7px}.card h2{font:600 19px/1.45 Inter,"PingFang SC",sans-serif;margin:10px 0 0}.badge{font-size:11px;color:var(--muted);white-space:nowrap}.route{display:grid;gap:7px;margin:16px 0 0}.step{display:grid;grid-template-columns:54px 1fr;gap:9px;align-items:start;background:#f0ece3;border-radius:9px;padding:8px 10px;font-size:13px}.step b{color:var(--green);font-size:11px;letter-spacing:.05em}.step span{font-family:Georgia,"Times New Roman",serif}.cnline{margin-top:12px;border-left:3px solid var(--gold);padding:7px 10px;color:#5f5549;font-size:13px}.answer{font:16px/1.78 Georgia,"Times New Roman",serif;margin-top:15px}.answer p{margin:10px 0}.prompt{margin-top:13px;color:var(--muted);font-size:13px}.prompt summary{cursor:pointer;color:var(--blue);font-weight:700}.prompt ul{padding-left:19px}.status{display:flex;gap:6px;flex-wrap:wrap;margin-top:15px;padding-top:12px;border-top:1px dashed var(--line)}.status button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 9px;font-size:11px}.status button.on[data-s="blank"]{background:#f3d8d4;border-color:#dba29c}.status button.on[data-s="shaky"]{background:#f0e3c6;border-color:#d7bd84}.status button.on[data-s="ok"]{background:#dceadf;border-color:#9fc2a7}.empty,.loading{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:28px;text-align:center;color:var(--muted)}body[data-view="anchor"] .answer,body[data-view="anchor"] .prompt{display:none}body[data-view="skeleton"] .answer{display:none}body[data-view="full"] .route,body[data-view="full"] .cnline{display:none}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;border-radius:999px;padding:8px 13px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:650px){.wrap{width:min(100% - 20px,980px);padding-top:20px}.hero h1{font-size:42px}.card{padding:15px}.card-head{display:block}.badge{display:block;margin-top:5px}.controls{top:64px}.step{grid-template-columns:48px 1fr}}
</style>
</head>
<body data-view="anchor">
<div class="wrap">
<header class="hero"><div class="eyebrow">IELTS SPEAKING · LAST-MINUTE RECALL</div><h1>先知道自己在说什么</h1><p>默认只看极短内容锚点和英文触发词。不是背中文翻译；需要确认表达时，再切到完整稿。</p><div class="stats"><div class="stat"><b id="p1n">—</b>P1</div><div class="stat"><b id="p2n">—</b>P2</div><div class="stat"><b id="weakn">0</b>待处理</div></div></header>
<div class="tabs"><button class="active" data-part="p1">Part 1</button><button data-part="p2">Part 2</button></div>
<section class="controls"><div class="searchrow"><input id="search" placeholder="搜索题目、主题或答案"><button id="random">随机一题</button></div><div class="view"><button class="active" data-view="anchor">极短提示</button><button data-view="skeleton">口头骨架</button><button data-view="full">完整稿</button></div><div class="actions"><button id="weakOnly">只看卡点</button><button id="resetStatus">清除当前部分标记</button></div><div class="filters" id="filters"></div><div class="source" id="source">正在读取原复习页……</div></section>
<main class="cards" id="cards"><div class="loading">正在载入全部题目……</div></main>
</div><div class="toast" id="toast"></div>
<script>
const SOURCE='../ielts-speaking-review/index.html';
const EXPECT={p1:175,p2:59};
const EXTRA=[
{part:'p1',id:'p1-work-1',topic:'Work',title:'What do you do?',answer:'<p>I work as a UI/UX designer. I mainly design interfaces and campaign pages for social and voice-based apps. My job is to turn product ideas into clear and usable screens.</p>',keys:['UI/UX designer','interfaces and campaign pages','clear and usable screens']},
{part:'p1',id:'p1-work-2',topic:'Work',title:'What is interesting about your job?',answer:'<p>The most interesting part is turning a vague idea into something visual and practical. For example, I sometimes need to make a complicated feature easier to understand through layout and interaction.</p>',keys:['vague idea','visual and practical','easier to understand']},
{part:'p1',id:'p1-work-3',topic:'Work',title:'Why did you choose this kind of work?',answer:'<p>I chose it because it combines visual design with problem-solving. I have always liked making things look clear, but I also enjoy working out how people can use them more easily.</p>',keys:['visual design','problem-solving','use them more easily']},
{part:'p1',id:'p1-work-4',topic:'Work',title:'Do you like your job?',answer:'<p>Yes, especially when I can work on a project from the early idea to the final design. Seeing a vague idea gradually become a real product gives me a strong sense of achievement.</p>',keys:['early idea','final design','real product']}
];
let DATA={p1:[],p2:[]},part='p1',filter='all',weakOnly=false;
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1400)}
function stateKey(id){return'ielts-recall:'+id}function getState(id){return localStorage.getItem(stateKey(id))||''}function setState(id,s){s?localStorage.setItem(stateKey(id),s):localStorage.removeItem(stateKey(id));updateWeak();render()}
function labels(n){return n===1?['核心']:n===2?['先答','展开']:n===3?['先答','原因','细节']:['先答','原因','细节','落点']}
function makeP1(doc){const arr=[...doc.querySelectorAll('.p1-card')].map((c,i)=>{const keys=(c.querySelector('.p1-keywords span')?.textContent||'').split('→').map(x=>x.trim()).filter(Boolean);return{part:'p1',id:c.id||'p1-'+i,topic:c.querySelector('.p1-topic-badge')?.textContent.trim()||'Other',title:c.querySelector('h3')?.textContent.trim()||'',answer:c.querySelector('.p1-answer')?.innerHTML||'',keys}});const hasWork=arr.some(x=>x.topic.toLowerCase()==='work'||/what do you do/i.test(x.title));return hasWork?arr:[...EXTRA,...arr]}
function makeP2(doc){return[...doc.querySelectorAll('#part2Panel .card, article.card[id^="q"]')].filter(c=>c.querySelector('.answer')).map((c,i)=>{const stages=[...c.querySelectorAll('.story-stage')].map(x=>({label:x.querySelector('b')?.textContent.trim()||'',text:x.querySelector('span')?.textContent.trim()||''})).filter(x=>x.text);const prompt=c.querySelector('.prompt');return{part:'p2',id:'p2-'+(c.id||i),topic:c.dataset.story||c.querySelector('.badges span')?.textContent.trim()||'Other',title:c.querySelector('.card-head h3')?.textContent.trim()||'',answer:c.querySelector('.answer')?.innerHTML||'',keys:stages,cn:c.querySelector('.story-keywords-cn span')?.textContent.trim()||'',prompt:prompt?.innerHTML||''}})}
async function load(){let html='',origin='在线原复习页';try{const r=await fetch(SOURCE+'?v='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);html=await r.text();localStorage.setItem('ielts-recall-source',html)}catch(e){html=localStorage.getItem('ielts-recall-source')||'';origin='本机缓存';if(!html)throw e}const doc=new DOMParser().parseFromString(html,'text/html');DATA.p1=makeP1(doc);DATA.p2=makeP2(doc);$('#p1n').textContent=DATA.p1.length;$('#p2n').textContent=DATA.p2.length;const rawP1=DATA.p1.length-(DATA.p1.some(x=>x.id==='p1-work-1')?4:0);const bad=rawP1!==EXPECT.p1||DATA.p2.length!==EXPECT.p2;$('#source').innerHTML=`来源：${origin} · P1 原题 ${rawP1}/${EXPECT.p1}${DATA.p1.length!==rawP1?' + 4 道工作开场':''} · P2 ${DATA.p2.length}/${EXPECT.p2}${bad?' <span class="bad">数量异常，请刷新检查</span>':''}`;buildFilters();render()}
function current(){return DATA[part]||[]}function updateWeak(){$('#weakn').textContent=[...DATA.p1,...DATA.p2].filter(x=>getState(x.id)&&getState(x.id)!=='ok').length}
function buildFilters(){const topics=[...new Set(current().map(x=>x.topic))];$('#filters').innerHTML='<button class="active" data-filter="all">全部</button>'+topics.map(t=>`<button data-filter="${esc(t)}">${esc(t)}</button>`).join('');filter='all'}
function route(item){if(item.part==='p1'){const labs=labels(item.keys.length);return item.keys.map((k,i)=>`<div class="step"><b>${labs[i]||'继续'}</b><span>${esc(k)}</span></div>`).join('')}return item.keys.map(k=>`<div class="step"><b>${esc(k.label)}</b><span>${esc(k.text)}</span></div>`).join('')}
function statusHtml(item){return`<div class="status"><button data-id="${esc(item.id)}" data-s="blank" class="${getState(item.id)==='blank'?'on':''}">脑子空白</button><button data-id="${esc(item.id)}" data-s="shaky" class="${getState(item.id)==='shaky'?'on':''}">知道但不稳</button><button data-id="${esc(item.id)}" data-s="ok" class="${getState(item.id)==='ok'?'on':''}">能自己说</button></div>`}
function render(){const q=$('#search').value.trim().toLowerCase();let arr=current().filter(x=>(filter==='all'||x.topic===filter)&&(!weakOnly||['blank','shaky'].includes(getState(x.id)))&&(!q||[x.title,x.topic,x.answer,x.cn,...(x.part==='p1'?x.keys:x.keys.map(k=>k.text))].join(' ').toLowerCase().includes(q)));$('#cards').innerHTML=arr.length?arr.map((x,i)=>`<article class="card" id="show-${esc(x.id)}"><div class="card-head"><div><span class="num">${String(i+1).padStart(2,'0')}</span><span class="topic">${esc(x.topic)}</span><h2>${esc(x.title)}</h2></div><span class="badge">${x.part==='p1'?'Part 1':'Part 2'}</span></div>${x.cn?`<div class="cnline">${esc(x.cn)}</div>`:''}<div class="route">${route(x)}</div>${x.prompt?`<details class="prompt"><summary>题目提示点</summary>${x.prompt}</details>`:''}<div class="answer">${x.answer}</div>${statusHtml(x)}</article>`).join(''):'<div class="empty">没有符合条件的题目。</div>'}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-part]');if(tab){part=tab.dataset.part;document.querySelectorAll('[data-part]').forEach(b=>b.classList.toggle('active',b===tab));$('#search').value='';weakOnly=false;$('#weakOnly').classList.remove('active');buildFilters();render();return}const v=e.target.closest('[data-view]');if(v){document.body.dataset.view=v.dataset.view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b===v));return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===f));render();return}const s=e.target.closest('[data-s]');if(s){const old=getState(s.dataset.id);setState(s.dataset.id,old===s.dataset.s?'':s.dataset.s)}});
$('#search').addEventListener('input',render);$('#weakOnly').onclick=()=>{weakOnly=!weakOnly;$('#weakOnly').classList.toggle('active',weakOnly);render()};$('#resetStatus').onclick=()=>{current().forEach(x=>localStorage.removeItem(stateKey(x.id)));updateWeak();render();toast('已清除当前部分标记')};$('#random').onclick=()=>{const list=[...document.querySelectorAll('.card')];if(!list.length)return;const x=list[Math.floor(Math.random()*list.length)];x.scrollIntoView({behavior:'smooth',block:'start'});x.animate([{outline:'3px solid #b08343'},{outline:'0 solid transparent'}],{duration:1200})};
load().catch(e=>{$('#cards').innerHTML='<div class="empty"><b>载入失败</b><br>'+esc(e.message)+'<br>请联网后刷新。</div>';$('#source').textContent='无法读取原复习页'});updateWeak();
</script>
</body>
</html>
