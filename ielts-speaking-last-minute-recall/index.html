<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Speaking 考前开口版</title><style>body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#f5f1e8;color:#202321;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:520px;padding:28px;text-align:center}.small{color:#6b706c;font-size:14px}.error{color:#a33;white-space:pre-wrap}</style></head><body><div class="box"><h1>正在加载复习材料…</h1><p class="small">正在载入学习卡片与本轮录音。</p><p id="err" class="error"></p></div><script>(async()=>{try{const names=['batch-payload-1.txt','batch-payload-2.txt','batch-payload-3.txt','batch-payload-4.txt','batch-payload-5.txt'];const parts=await Promise.all(names.map(n=>fetch(n+'?v=4').then(r=>{if(!r.ok)throw new Error(n+' 加载失败');return r.text()})));const b64=parts.join('').replace(/\s/g,'');const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('浏览器版本过旧，请升级后重试');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('h1').textContent='页面加载失败';document.getElementById('err').textContent=e.message+'\n请强制刷新后重试。'}})();</script></body></html>
