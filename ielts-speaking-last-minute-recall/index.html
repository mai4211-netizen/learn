<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Speaking 考前开口版</title><style>body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#f5f1e8;color:#202321;display:grid;place-items:center;min-height:100vh;margin:0}.box{max-width:560px;padding:28px;text-align:center}.small{color:#6b706c;font-size:14px}.progress{height:6px;background:#ded8cc;border-radius:999px;overflow:hidden;margin:18px 0}.bar{height:100%;width:0;background:#375d50;transition:width .2s}.error{color:#a33;white-space:pre-wrap}.retry{display:none;margin:16px auto 0;border:0;border-radius:10px;background:#202321;color:#fff;padding:10px 16px;font:inherit;cursor:pointer}</style></head><body><div class="box"><h1>正在加载复习材料…</h1><p class="small" id="status">正在载入学习卡片与录音分析。</p><div class="progress"><div class="bar" id="bar"></div></div><p id="err" class="error"></p><button class="retry" id="retry">重新加载</button></div><script>
const EXPECTED_LENGTH=43116;
const EXPECTED_SHA256='37d44065866508b993cd0940427067fe24662c521d2ff6f3dd3c2150fa0fd878';
async function sha256(text){const data=new TextEncoder().encode(text),hash=await crypto.subtle.digest('SHA-256',data);return[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function boot(){const title=document.querySelector('h1'),status=document.getElementById('status'),err=document.getElementById('err'),bar=document.getElementById('bar'),retry=document.getElementById('retry');try{retry.style.display='none';err.textContent='';title.textContent='正在加载复习材料…';const names=Array.from({length:8},(_,i)=>`page-v6-${i+1}.txt`),parts=[];for(let i=0;i<names.length;i++){status.textContent=`正在读取页面 ${i+1}/${names.length}…`;const r=await fetch(names[i]+'?v=8',{cache:'no-store'});if(!r.ok)throw new Error(names[i]+' 加载失败（HTTP '+r.status+'）');const text=await r.text();if(!text)throw new Error(names[i]+' 内容为空');parts.push(text);bar.style.width=((i+1)/names.length*65)+'%'}const html=parts.join('');status.textContent='正在校验页面…';bar.style.width='72%';if(html.length!==EXPECTED_LENGTH)throw new Error(`页面长度校验失败（${html.length}/${EXPECTED_LENGTH}）`);const digest=await sha256(html);if(digest!==EXPECTED_SHA256)throw new Error('页面完整性校验失败');for(const token of ['<!doctype html>','id="learningMode"','data-record-start','button[data-view]','本轮练习','分享练习包'])if(!html.includes(token))throw new Error('页面功能校验失败：'+token);status.textContent='正在加载交互功能…';bar.style.width='80%';const [v7Response,v8Response]=await Promise.all([fetch('patch-v7.js?v=8',{cache:'no-store'}),fetch('patch-v8.js?v=8',{cache:'no-store'})]);if(!v7Response.ok)throw new Error('学习卡片功能加载失败（HTTP '+v7Response.status+'）');if(!v8Response.ok)throw new Error('录音分析功能加载失败（HTTP '+v8Response.status+'）');const [v7Text,v8Text]=await Promise.all([v7Response.text(),v8Response.text()]);for(const token of ['patchedRender','question-concealed','data-record-delete-current','speakQuestion'])if(!v7Text.includes(token))throw new Error('学习卡片功能校验失败：'+token);for(const token of ['startRecordingV8','robustSaveTake','v8-transcript','localAnalyzeV8','__IELTS_RECALL_V8__'])if(!v8Text.includes(token))throw new Error('录音分析功能校验失败：'+token);status.textContent='正在完成加载…';bar.style.width='92%';const scripts='<script src="patch-v7.js?v=8"></scr'+'ipt><script src="patch-v8.js?v=8"></scr'+'ipt>';const finalHtml=html.replace('</body>',scripts+'</body>');bar.style.width='100%';status.textContent='加载完成';document.open();document.write(finalHtml);document.close()}catch(e){title.textContent='页面加载失败';status.textContent='没有修改你的录音或本轮练习数据。';err.textContent=e.message;retry.style.display='inline-block'}}
document.getElementById('retry').onclick=boot;boot();
</script></body></html>
