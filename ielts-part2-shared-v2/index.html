<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS Part 2 · 共用段落整合版</title>
<style>
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#faf8f5;color:#6b645c}.loading{height:100%;display:grid;place-items:center;padding:24px;text-align:center;font-size:14px;line-height:1.7}
</style>
<script src="assets/pako.min.js?v=20260729-3"></script>
</head>
<body><div class="loading">正在载入…</div>
<script>
(async()=>{
  try{
    if(!window.pako) throw new Error('本地解压组件载入失败');
    const version='20260729-3';
    const files=Array.from({length:8},(_,i)=>`assets/part-${String(i).padStart(2,'0')}.txt?v=${version}`);
    const parts=await Promise.all(files.map(async file=>{
      const response=await fetch(file,{cache:'no-store'});
      if(!response.ok) throw new Error(`${file}: ${response.status}`);
      return (await response.text()).trim();
    }));
    const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
    const html=new TextDecoder('utf-8').decode(window.pako.ungzip(bytes));
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="loading">页面载入失败。请关闭当前页面后重新打开。<br><small>'+String(error.message||error)+'</small></div>';
  }
})();
</script>
</body>
</html>
