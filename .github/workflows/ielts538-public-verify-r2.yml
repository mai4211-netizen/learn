name: IELTS 538 public Pages verification r2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-public-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed GitHub Pages build
        shell: bash
        run: |
          set -euo pipefail
          URL='https://mai4211-netizen.github.io/learn/'
          ok=0
          for attempt in $(seq 1 24); do
            echo "Pages check ${attempt}/24"
            stamp="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            html="$(curl -fsSL --connect-timeout 10 --max-time 20 "${URL}?qa=${stamp}" || true)"
            css="$(curl -fsSL --connect-timeout 10 --max-time 20 "${URL}styles.css?qa=${stamp}" || true)"
            responsive="$(curl -fsSL --connect-timeout 10 --max-time 20 "${URL}responsive.css?qa=${stamp}" || true)"
            app="$(curl -fsSL --connect-timeout 10 --max-time 20 "${URL}app.js?qa=${stamp}" || true)"
            data="$(curl -fsSL --connect-timeout 10 --max-time 20 "${URL}data.js?qa=${stamp}" || true)"
            if grep -q 'data-build="2026-07-30-r2"' <<<"$html" \
              && grep -q 'styles.css?v=20260730-r2' <<<"$html" \
              && grep -q 'responsive.css?v=20260730-r2' <<<"$html" \
              && grep -q -- '--primary: #2457e6' <<<"$css" \
              && grep -q 'grid-template-columns: repeat(3, minmax(0,1fr))' <<<"$responsive" \
              && grep -q 'IELTS538_R2_DATA_POLICY' <<<"$app" \
              && grep -q '"word":"approach","ipa_us":"/əˈproʊtʃ/"' <<<"$data"; then
              echo "PUBLIC_PAGES_OK ${URL}"
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
