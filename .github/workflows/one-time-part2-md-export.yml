name: One-time Part 2 Markdown export

on:
  push:
    paths:
      - '.github/workflows/one-time-part2-md-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split standalone Markdown documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil
          root = Path('ielts-part2-memory-2026q4')
          source = (root / 'IELTS_Part2_58_answers_revision_principles_2026-11-09.md').read_text(encoding='utf-8')
          start = source.index('## 三、58 题完整文本')
          end = source.index('## 四、版本记录', start)
          answers = '# IELTS Speaking Part 2｜58 题完整文本\n\n> 来源：2026-11-09 GitHub 最新确认版本；与修改原则分开保存。\n\n' + source[start:end].strip() + '\n'
          questions = re.findall(r'^### Q\d{2} ·', answers, flags=re.M)
          assert len(questions) == 58, len(questions)
          assert 'forest park with a lake on the outskirts of Guangzhou' in answers
          assert 'different brands and artists' in answers
          output = Path('md-export')
          output.mkdir(exist_ok=True)
          (output / '雅思口语_Part2_58题文本.md').write_text(answers, encoding='utf-8')
          shutil.copyfile(root / 'IELTS_Part2_修改原则.md', output / '雅思口语_Part2_修改原则.md')
          print('Exported', len(questions), 'answers plus separate principles')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: part2-md-files
          path: md-export/*.md
          retention-days: 30
