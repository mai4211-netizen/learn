  .chip-btn:hover, .ghost-pill:hover { transform: translateY(-1px); }
}
@media (max-width: 640px) {
  header { padding: max(10px, env(safe-area-inset-top)) 14px 7px; }
  .head-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; }
  .title { font-size: clamp(18px, 5.3vw, 22px); padding-top: 10px; }
  .tabs { flex: 0 0 auto; }
  .tab-btn { min-width: 48px; min-height: 36px; padding-inline: 10px; font-size: 12px; }
  .search-box { margin-top: 9px; min-height: 44px; font-size: 16px; }
  .audio-settings { margin-top: 3px; }
  main { width: 100%; }
  #card-view { padding: 4px 10px 8px; align-items: center; }
  .v2-card-wrap { width: min(94vw, 500px); height: min(62dvh, 520px); }
  .front { padding: 30px 18px 14px; }
  .back { padding: 30px 18px 18px; }
  .face { border-radius: 24px; }
  #main-footer { width: calc(100% - 20px); margin-bottom: max(6px, env(safe-area-inset-bottom)); }
}
@media (max-width: 390px) {
  .title { font-size: 17px; }
  .tab-btn { min-width: 44px; padding-inline: 8px; }
  .v2-card-wrap { height: min(60dvh, 488px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
'''

          # Add a class hook showing the build version without visible clutter.
          html = html.replace('<body class="v2-shell v2-only">', '<body class="v2-shell v2-only" data-build="2026-07-30">', 1)

          Path('styles.css').write_text(css, encoding='utf-8')
          Path('data.js').write_text(data_js, encoding='utf-8')
          Path('app.js').write_text(app_js, encoding='utf-8')
          index_path.write_text(html, encoding='utf-8')

          # Static adversarial checks.
          assert 'user-scalable=no' not in html
          assert 'maximum-scale=1.0' not in html
          assert '<style>' not in html
          assert 'window.__IELTS_DATA__' not in html
          assert 'SYLLABLE_OVERRIDES' in app_js
          assert 'getCategoryId' in app_js
          assert 'VOICE_PREF_KEY' in app_js
          assert 'normalizeExampleBlocks' in app_js
          assert '100dvh' in css
          assert 'prefers-reduced-motion' in css

          # Dataset integrity: unchanged 376 core / 162 replacement / 538 total and no orphan anchors.
          m = re.search(r'window\.__IELTS_DATA__\s*=\s*(\{.*\})\s*;?\s*$', data_js, re.S)
          if not m:
              raise SystemExit('could not parse data assignment')
          bundle = json.loads(m.group(1))
          core = bundle.get('core', [])
          repl = bundle.get('replacement', [])
          if len(core) != 376 or len(repl) != 162 or len(core) + len(repl) != 538:
              raise SystemExit(f'dataset count changed: core={len(core)} replacement={len(repl)}')
          ids = {str(x.get('id')) for x in core}
          orphans = [r.get('id') for r in repl if str(r.get('anchor_core_id')) not in ids]
          if orphans:
              raise SystemExit(f'orphan replacements: {orphans[:5]}')
          if len(ids) != len(core):
              raise SystemExit('duplicate core IDs')
          print('Static QA passed: 376 core + 162 replacement, zero orphan anchors')
          PY

      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check data.js

      - name: Browser acceptance tests
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 4173 >/tmp/ielts538-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const cases = [
              {name:'desktop', viewport:{width:1440,height:900}},
              {name:'iphone', viewport:{width:390,height:844}, isMobile:true, hasTouch:true},
            ];
            for (const cfg of cases) {
              const context = await browser.newContext({viewport:cfg.viewport, isMobile:!!cfg.isMobile, hasTouch:!!cfg.hasTouch});
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
              page.on('console', msg => { if (msg.type() === 'error') errors.push(`console: ${msg.text()}`); });
              await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
              await page.waitForSelector('#f-word:not(:has-text("loading"))', {timeout:10000});
              const state = await page.evaluate(() => ({
                build: document.body.dataset.build,
                width: document.documentElement.scrollWidth,
                innerWidth: window.innerWidth,
                word: document.querySelector('#f-word')?.textContent?.trim(),
                progress: document.querySelector('#progress')?.textContent?.trim(),
                stylesLoaded: getComputedStyle(document.body).minHeight,
                appLoaded: typeof window.switchView === 'function',
              }));
              if (state.build !== '2026-07-30') throw new Error(`${cfg.name}: build hook missing`);
              if (!state.word || state.word === 'loading') throw new Error(`${cfg.name}: word did not render`);
              if (!state.progress || !state.progress.includes('/')) throw new Error(`${cfg.name}: progress did not render`);
              if (state.width > state.innerWidth + 2) throw new Error(`${cfg.name}: horizontal overflow ${state.width} > ${state.innerWidth}`);
              if (errors.length) throw new Error(`${cfg.name}: JS errors: ${errors.join(' | ')}`);

              await page.click('#tab-list');
              if (!(await page.locator('#list-view').isVisible())) throw new Error(`${cfg.name}: list tab failed`);
              await page.fill('#search', 'resemble');
              await page.waitForTimeout(100);
              if ((await page.locator('#list-items').innerText()).toLowerCase().indexOf('resemble') < 0) throw new Error(`${cfg.name}: search failed`);
              await page.fill('#search', '');
              await page.click('#tab-card');
              await page.click('#tab-review');
              if (!(await page.locator('#review-view').isVisible())) throw new Error(`${cfg.name}: review tab failed`);
              await page.click('#tab-card');
              await page.locator('#audio-settings summary').click();
              if (!(await page.locator('#voice-select').isVisible())) throw new Error(`${cfg.name}: voice settings failed`);

              await page.screenshot({path:`qa-${cfg.name}.png`, fullPage:true});
              await context.close();
              console.log(`${cfg.name} QA passed`, state);
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS

      - name: Adversarial regression checks
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          css = Path('styles.css').read_text()
          js = Path('app.js').read_text()
          checks = {
            'zoom remains available': 'user-scalable=no' not in html and 'maximum-scale' not in html,
            'externalized CSS': html.count('styles.css') == 1 and '<style>' not in html,
            'externalized app/data': html.count('app.js') == 1 and html.count('data.js') == 1,
            'no inline dataset duplication': 'window.__IELTS_DATA__' not in html,
            'mobile dynamic viewport': '100dvh' in css,
            'focus visibility retained': 'focus-visible' in css and 'outline: 3px' in css,
            'voice preference persisted': 'localStorage.setItem(VOICE_PREF_KEY' in js,
            'category regex centralized': js.count('function getCategoryId') == 1,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items(): print(('PASS ' if ok else 'FAIL ') + name)
          if failed: raise SystemExit('regression checks failed: ' + ', '.join(failed))
          PY

      - name: Save QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ielts538-qa-screenshots
          path: qa-*.png
          retention-days: 7

      - name: Commit verified upgrade
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/upgrade-root-app.yml
          git add index.html styles.css data.js app.js .github/workflows/upgrade-root-app.yml
          git commit -m 'feat: upgrade IELTS 538 UI and learning reliability'
          git push origin HEAD:main
