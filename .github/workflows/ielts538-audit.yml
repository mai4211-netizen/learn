name: IELTS 538 redesign acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply conservative data corrections
        run: python3 tools/apply_538_redesign_fixes.py

      - name: Dataset integrity and regression checks
        shell: bash
        run: |
          python3 tools/audit_538.py
          node --check app.js
          node --check data.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          text=Path('data.js').read_text(encoding='utf-8').strip()
          data=json.loads(text[len('window.__IELTS_DATA__ = '):].rstrip(';\n '))
          items={x['word'].strip().lower():x for g in ('core','replacement') for x in data[g]}
          assert len(data['core']) == 376
          assert len(data['replacement']) == 162
          assert items['approach']['ipa_us'] == '/əˈproʊtʃ/'
          assert items['prompt']['ipa_us'] == '/prɑːmpt/'
          assert items['component']['ipa_us'] == '/kəmˈpoʊ.nənt/'
          assert 'bene（好）+ fic' not in items['approach']['root_memory']
          assert 'immun（免除' not in items['trait']['root_memory']
          assert 'intelli-gence' not in ' '.join(items['artificial'].get('phrases',[]))
          assert items['approach']['phrases'] == ['an approach to sth 做某事的方法/途径', 'approach sb/sth 接近某人/某物']
          app=Path('app.js').read_text(encoding='utf-8')
          assert 'IELTS538_R2_DATA_POLICY' in app
          assert "ipa_us: '/noʊ/'" in app
          assert '记忆提示' in app
          assert "style.display = mode === 'card' ? 'grid' : 'none'" in app
          print('DATA_REGRESSION_PASS')
          PY

      - name: Install browser and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Browser acceptance desktop and iPhone
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/ielts538-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const cases = [
              {name:'desktop', options:{viewport:{width:1440,height:900}}},
              {name:'iphone14', options:{...devices['iPhone 14']}},
            ];
            for (const cfg of cases) {
              const context = await browser.newContext(cfg.options);
              const page = await context.newPage();
              const errors=[];
              page.on('pageerror', e => errors.push(`pageerror:${e.message}`));
              page.on('console', m => { if (m.type()==='error') errors.push(`console:${m.text()}`); });
              await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
              await page.waitForFunction(() => {
                const w=document.querySelector('#f-word')?.textContent?.trim();
                return w && w !== 'loading' && w !== '数据加载失败';
              }, null, {timeout:10000});

              const unlock=page.locator('#speech-unlock-overlay:not(.hidden) #speech-unlock-btn');
              if (await unlock.count()) {
                await unlock.click();
                await page.locator('#speech-unlock-overlay').waitFor({state:'hidden'});
              }

              const metrics=await page.evaluate(() => ({
                build: document.body.dataset.build,
                iw: window.innerWidth,
                sw: document.documentElement.scrollWidth,
                vw: window.visualViewport?.width || window.innerWidth,
                card: document.querySelector('.v2-card-wrap')?.getBoundingClientRect().toJSON(),
                footer: document.querySelector('#main-footer')?.getBoundingClientRect().toJSON(),
                word: document.querySelector('#f-word')?.textContent?.trim(),
                progress: document.querySelector('#progress')?.textContent?.trim(),
                core: window.__IELTS_DATA__?.core?.length,
                replacement: window.__IELTS_DATA__?.replacement?.length,
              }));
              if (metrics.build !== '2026-07-30-r2') throw new Error(`${cfg.name}: wrong build ${metrics.build}`);
              if (metrics.core !== 376 || metrics.replacement !== 162) throw new Error(`${cfg.name}: dataset count regression`);
              if (metrics.sw > metrics.iw + 2) throw new Error(`${cfg.name}: horizontal overflow ${metrics.sw}/${metrics.iw}`);
              if (Math.abs(metrics.vw-metrics.iw) > 3) throw new Error(`${cfg.name}: viewport mismatch ${metrics.vw}/${metrics.iw}`);
              for (const [label, rect] of [['card',metrics.card],['footer',metrics.footer]]) {
                if (!rect || rect.left < -2 || rect.right > metrics.iw + 2) throw new Error(`${cfg.name}: ${label} out of viewport`);
              }
              if (!metrics.progress?.includes('/')) throw new Error(`${cfg.name}: progress missing`);
              if (errors.length) throw new Error(`${cfg.name}: ${errors.join(' | ')}`);
              await page.screenshot({path:`qa-${cfg.name}-card.png`, fullPage:true});

              await page.fill('#search','approach');
              await page.waitForTimeout(100);
              const approach = await page.locator('#f-word').innerText();
              if (!approach.toLowerCase().includes('approach')) throw new Error(`${cfg.name}: card search failed`);
              const ipa = await page.locator('#f-ipa').innerText();
              if (!ipa.includes('/əˈproʊtʃ/')) throw new Error(`${cfg.name}: corrected approach US IPA not rendered: ${ipa}`);
              await page.locator('#main-card').click({position:{x:260,y:250}});
              await page.waitForTimeout(550);
              const backText=await page.locator('#b-content').innerText();
              if (backText.includes('bene（好）') || backText.includes('待校验')) throw new Error(`${cfg.name}: unverified/wrong content visible on approach back`);
              if (!backText.includes('记忆提示') || !backText.includes('an approach to sth')) throw new Error(`${cfg.name}: polished approach content missing`);
              await page.screenshot({path:`qa-${cfg.name}-back.png`, fullPage:true});

              await page.fill('#search','measure');
              await page.waitForTimeout(100);
              if (await page.locator('#main-card').evaluate(el => el.classList.contains('flipped'))) {
                await page.locator('#main-card').click({position:{x:260,y:250}});
                await page.waitForTimeout(500);
              }
              await page.locator('#main-card').click({position:{x:260,y:250}});
              await page.waitForTimeout(500);
              const measureBack=await page.locator('#b-content').innerText();
              if (measureBack.includes('例句待校验')) throw new Error(`${cfg.name}: pending example still shown`);
              if (await page.locator('#main-card').evaluate(el => el.classList.contains('flipped'))) {
                await page.locator('#main-card').click({position:{x:260,y:250}});
                await page.waitForTimeout(500);
              }

              await page.click('#tab-list');
              if (!(await page.locator('#tab-list').evaluate(el => el.classList.contains('active'))) || await page.locator('#tab-review').evaluate(el => el.classList.contains('active'))) throw new Error(`${cfg.name}: list tab active state wrong`);
              await page.fill('#search','resemble');
              await page.waitForTimeout(120);
              if (!(await page.locator('#list-items').innerText()).toLowerCase().includes('resemble')) throw new Error(`${cfg.name}: list search failed`);
              await page.locator('#search').evaluate(el => el.blur());
              await page.screenshot({path:`qa-${cfg.name}-list.png`, fullPage:true});
              await page.fill('#search','');

              await page.click('#tab-review');
              if (!(await page.locator('#review-view').isVisible())) throw new Error(`${cfg.name}: review view failed`);
              if (!(await page.locator('#tab-review').evaluate(el => el.classList.contains('active'))) || await page.locator('#tab-list').evaluate(el => el.classList.contains('active'))) throw new Error(`${cfg.name}: review tab active state wrong`);
              await page.screenshot({path:`qa-${cfg.name}-review.png`, fullPage:true});

              await page.click('#tab-card');
              if (!(await page.locator('#tab-card').evaluate(el => el.classList.contains('active')))) throw new Error(`${cfg.name}: card tab active state wrong`);
              const footerDisplay=await page.locator('#main-footer').evaluate(el => getComputedStyle(el).display);
              if (footerDisplay !== 'grid') throw new Error(`${cfg.name}: footer layout regressed to ${footerDisplay}`);
              await page.locator('#audio-settings summary').click();
              if (!(await page.locator('#voice-select').isVisible())) throw new Error(`${cfg.name}: voice selector failed`);
              await context.close();
              console.log(cfg.name, 'PASS', metrics);
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          JS

      - name: Upload acceptance screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ielts538-redesign-qa
          path: qa-*.png
          retention-days: 7

      - name: Persist verified data corrections to PR branch
        shell: bash
        run: |
          if git diff --quiet -- app.js data.js; then
            echo 'No generated data/app changes to persist.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js data.js
          git commit -m 'fix: apply verified IELTS 538 data corrections'
          git push origin HEAD:${{ github.head_ref }}
