name: Restore IELTS static HTML

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild exact static HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          source = Path('ielts-part2-shared-v2/assets')
          encoded = ''.join(
              (source / f'part-{i:02d}.txt').read_text(encoding='utf-8').strip()
              for i in range(8)
          )
          html = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          digest = hashlib.sha256(html.encode('utf-8')).hexdigest()
          expected = 'f77da22c265c39ee51f20ba3c1d17360995d370a653692557558a0e856092a09'
          if digest != expected:
              raise SystemExit(f'checksum mismatch: {digest}')
          if html.count('class="card"') != 59:
              raise SystemExit('card count mismatch')

          for target in (
              Path('ielts-part2-shared-v2/index.html'),
              Path('ielts-part2-shared-v2-direct/index.html'),
              Path('ielts-part2-shared-v2-static/index.html'),
          ):
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(html, encoding='utf-8')
              print(target, len(html.encode('utf-8')), digest)
          PY

      - name: Commit exact static HTML to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ielts-part2-shared-v2/index.html ielts-part2-shared-v2-direct/index.html ielts-part2-shared-v2-static/index.html
          if git diff --cached --quiet; then
            echo "Already exact; nothing to commit"
          else
            git commit -m "Deploy exact IELTS Part 2 static HTML"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
