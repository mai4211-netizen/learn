name: Restore IELTS static HTML

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild exact static HTML
        run: python .github/scripts/restore_ielts.py

      - name: Commit exact static HTML to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ielts-part2-shared-v2/index.html ielts-part2-shared-v2-direct/index.html ielts-part2-shared-v2-static/index.html ielts-restore-debug.txt
          if git diff --cached --quiet; then
            echo "Already exact; nothing to commit"
          else
            git commit -m "Deploy exact IELTS Part 2 static HTML"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
