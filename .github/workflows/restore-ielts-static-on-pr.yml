name: Restore IELTS static HTML

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild exact static HTML
        id: rebuild
        continue-on-error: true
        run: python .github/scripts/restore_ielts.py

      - name: Commit result and diagnostics to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate exact IELTS static HTML"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
