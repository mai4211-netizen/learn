name: Rebuild IELTS Part 2 static page

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rebuild-ielts-part2-static.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore original HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          source = Path('ielts-part2-shared-v2/assets')
          encoded = ''.join(
              (source / f'part-{index:02d}.txt').read_text(encoding='utf-8').strip()
              for index in range(8)
          )
          html = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          digest = hashlib.sha256(html.encode('utf-8')).hexdigest()
          expected = 'f77da22c265c39ee51f20ba3c1d17360995d370a653692557558a0e856092a09'
          if digest != expected:
              raise SystemExit(f'HTML checksum mismatch: {digest}')
          if '<title>IELTS Part 2 · 共用段落整合版</title>' not in html:
              raise SystemExit('HTML title check failed')

          for target in [
              Path('ielts-part2-shared-v2/index.html'),
              Path('ielts-part2-shared-v2-final/index.html'),
          ]:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(html, encoding='utf-8')
              print(f'wrote {target} ({len(html.encode("utf-8"))} bytes)')
          PY

      - name: Commit restored static pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ielts-part2-shared-v2/index.html ielts-part2-shared-v2-final/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Replace IELTS Part 2 loaders with static HTML"
            git push
          fi
