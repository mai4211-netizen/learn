name: IELTS 538 final device QA

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  device-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install browser and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Verify desktop and real iPhone descriptor
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/ielts538-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const cases = [
              {name:'desktop', options:{viewport:{width:1440,height:900}}},
              {name:'iphone14', options:{...devices['iPhone 14']}},
            ];
            for (const cfg of cases) {
              const context = await browser.newContext(cfg.options);
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push(`pageerror:${e.message}`));
              page.on('console', m => { if (m.type()==='error') errors.push(`console:${m.text()}`); });
              await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
              await page.waitForFunction(() => document.querySelector('#f-word')?.textContent?.trim() !== 'loading');
              const metrics = await page.evaluate(() => ({
                innerWidth: window.innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                visualWidth: window.visualViewport?.width || window.innerWidth,
                innerHeight: window.innerHeight,
                bodyBuild: document.body.dataset.build,
                footerRect: document.querySelector('#main-footer')?.getBoundingClientRect().toJSON(),
                cardRect: document.querySelector('.v2-card-wrap')?.getBoundingClientRect().toJSON(),
              }));
              if (metrics.bodyBuild !== '2026-07-30') throw new Error(`${cfg.name}: wrong build`);
              if (metrics.scrollWidth > metrics.innerWidth + 2) throw new Error(`${cfg.name}: horizontal overflow ${metrics.scrollWidth}/${metrics.innerWidth}`);
              if (Math.abs(metrics.visualWidth - metrics.innerWidth) > 3) throw new Error(`${cfg.name}: visual viewport mismatch ${metrics.visualWidth}/${metrics.innerWidth}`);
              if (!metrics.cardRect || metrics.cardRect.right > metrics.innerWidth + 2 || metrics.cardRect.left < -2) throw new Error(`${cfg.name}: card out of viewport`);
              if (!metrics.footerRect || metrics.footerRect.right > metrics.innerWidth + 2 || metrics.footerRect.left < -2) throw new Error(`${cfg.name}: footer out of viewport`);
              if (errors.length) throw new Error(`${cfg.name}: ${errors.join('|')}`);
              await page.screenshot({path:`final-${cfg.name}.png`, fullPage:true});
              await page.click('#tab-list');
              await page.fill('#search','resemble');
              if (!(await page.locator('#list-items').innerText()).toLowerCase().includes('resemble')) throw new Error(`${cfg.name}: search regression`);
              await page.fill('#search','');
              await page.click('#tab-review');
              if (!(await page.locator('#review-view').isVisible())) throw new Error(`${cfg.name}: review regression`);
              await context.close();
              console.log(cfg.name, 'PASS', metrics);
            }
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: ielts538-final-device-qa
          path: final-*.png
          retention-days: 7
