name: Build IELTS Part2 PDF

on:
  push:
    paths:
      - "ielts-part2-memory-2026q4/**"
      - "tools/build_part2_pdf.py"
      - ".github/workflows/build-part2-pdf.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install reportlab
      - run: python tools/build_part2_pdf.py
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ielts-part2-memory-2026q4/IELTS_Part2_2026Q4_Offline.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Build offline IELTS Part 2 PDF"
            git push
          fi
