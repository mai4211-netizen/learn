<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IELTS Speaking 句子主干训练</title><style>:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#202321;--muted:#6b706c;--line:#d9d2c5;--green:#375d50;--gold:#b08343;--bad:#9b322d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"PingFang SC",sans-serif}.wrap{width:min(100% - 28px,980px);margin:auto;padding:30px 0 90px}.hero{padding:24px 0 14px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:800}.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,6vw,58px);line-height:1;margin:10px 0 12px}.hero p{max-width:730px;color:var(--muted);line-height:1.7;margin:0}.rule{margin-top:18px;padding:14px 16px;border-left:4px solid var(--gold);background:#fff8e9;border-radius:0 12px 12px 0;line-height:1.65}.toolbar{position:sticky;top:0;z-index:5;background:rgba(245,241,232,.94);backdrop-filter:blur(10px);padding:12px 0;border-bottom:1px solid rgba(217,210,197,.8)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,.link{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);padding:9px 13px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}button.active,button.primary{background:var(--green);border-color:var(--green);color:white}button:disabled{opacity:.45;cursor:not-allowed}.count{margin-left:auto;font-size:13px;color:var(--muted)}.stage{margin-top:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 34px rgba(54,47,37,.07)}.meta{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#edf3f0;color:var(--green);font-size:12px;font-weight:800}.num{font-family:Georgia,serif;font-size:14px;color:var(--muted)}.cue{margin-top:18px;color:var(--muted);font-size:13px}.starter{font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,5.5vw,52px);line-height:1.08;margin:8px 0 6px;color:var(--green)}.shell{font-family:Georgia,"Times New Roman",serif;font-size:clamp(23px,4vw,36px);line-height:1.28;margin:16px 0;padding:18px;border:1px dashed var(--line);border-radius:15px;background:#fff}.shell.hidden{filter:blur(10px);user-select:none}.prompt{font-size:14px;color:var(--muted);margin-bottom:12px}.examples{display:grid;gap:10px;margin-top:16px}.example{padding:12px 14px;background:#f8f5ee;border-radius:12px;font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.45}.slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.slot{padding:7px 10px;border-radius:9px;background:#edf3f0;color:var(--green);font-size:13px;font-weight:700}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.actions button{min-height:44px}.drill{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}.drill h2{font-family:Georgia,serif;margin:0 0 10px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.step b{display:block;color:var(--green);margin-bottom:5px}.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.status button[data-state="automatic"].active{background:var(--green)}.status button[data-state="two-second"].active{background:var(--gold);border-color:var(--gold)}.status button[data-state="unstable"].active{background:var(--bad);border-color:var(--bad)}.list{margin-top:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.mini{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}.mini:hover{border-color:var(--green)}.mini b{display:block;font-family:Georgia,serif;font-size:20px;margin:6px 0}.mini span{font-size:12px;color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:720px){.wrap{width:min(100% - 18px,980px);padding-top:14px}.toolbar .row{flex-wrap:nowrap;overflow:auto;padding-bottom:3px}.toolbar button,.toolbar .link{flex:0 0 auto}.count{display:none}.card{padding:18px;border-radius:18px}.steps{grid-template-columns:1fr 1fr}.list{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button{width:100%}.status{display:grid;grid-template-columns:1fr 1fr 1fr}.status button{padding:9px 5px;font-size:12px}.starter{font-size:34px}.shell{font-size:27px}}</style></head><body><div class="wrap"><header class="hero"><div class="eyebrow">IELTS Speaking · Sentence Shells</div><h1>先把主干说完整</h1><p>目标不是背长答案。先让前四到六个词在两秒内自动出来，再替换后半句。简单、完整、能继续说，比当场找高级词更重要。</p><div class="rule"><b>合格标准：</b>看到提示后两秒内说出主干；连续换三个内容，主干不掉、不改时态、不漏助动词。</div></header><nav class="toolbar"><div class="row" id="filters"></div><div class="row" style="margin-top:8px"><button class="primary" id="random">随机一条</button><button id="next">下一条</button><button id="showAll">全部主干</button><a class="link" href="../ielts-speaking-last-minute-recall/">返回题库</a><span class="count" id="count"></span></div></nav><main class="stage"><section class="card" id="card"></section><section class="list" id="list" hidden></section></main></div><script>const DATA=[{id:'fact-live',cat:'现在事实',cue:'住在哪里 / 城市特点',start:'I live in…',shell:'I live in ___, and it is ___.',examples:['I live in Guangzhou, and it is hot and humid.','I live in southern China, and it is a very modern area.'],slots:['Guangzhou · hot and humid','a big city · quite busy','southern China · warm most of the year']},{id:'fact-work',cat:'现在事实',cue:'工作 / 主要内容',start:'I work as…',shell:'I work as a/an ___, and I mainly ___.',examples:['I work as a designer, and I mainly design interfaces.','I work as a UI/UX designer, and I mainly solve design problems.'],slots:['designer · design interfaces','UI/UX designer · improve user experience','designer · turn ideas into clear pages']},{id:'routine-usually',cat:'现在事实',cue:'习惯 / 日常',start:'I usually…',shell:'I usually ___ because ___.',examples:['I usually go for a walk because it helps me relax.','I usually check my activity rings because I do not want to break my streak.'],slots:['go for a walk · it clears my mind','use a smartwatch · it keeps me motivated','stay at home · I need some quiet time']},{id:'place-gets',cat:'现在事实',cue:'地方变得拥挤 / 热闹',start:'It gets…',shell:'It gets very ___ when ___.',examples:['It gets very crowded when exhibitions are held.','It gets very noisy when too many cars come into the area.'],slots:['crowded · exhibitions are held','busy · people finish work','noisy · there is a big event']},{id:'preference-rather',cat:'原因偏好',cue:'更愿意 / 不喜欢拥挤',start:"I'd rather…",shell:"I'd rather ___ because ___.",examples:["I'd rather stay somewhere quiet because crowded places make me tired.","I'd rather plan the trip early because last-minute changes are stressful."],slots:['stay somewhere quiet · crowds make me tired','walk outside · it helps me think','book early · it is less stressful']},{id:'reason-main',cat:'原因偏好',cue:'最主要原因',start:'The main reason is…',shell:'The main reason is that ___.',examples:['The main reason is that it helps me stay organized.','The main reason is that I do not want to miss the chance.'],slots:['it saves me time','it makes me feel safer','I do not want to regret it']},{id:'feel-clause',cat:'原因偏好',cue:'感觉像 / 后面完整句',start:'I feel like…',shell:'I feel like ___ is/are ___.',examples:['I feel like the sun is cooking me.','I feel like everyone is looking at me.'],slots:['the sun · cooking me','everyone · looking at me','the city · getting busier']},{id:'past-first',cat:'过去故事',cue:'故事开头',start:'At first, I…',shell:'At first, I ___, but then ___.',examples:['At first, I wanted to give up, but then I decided to keep going.','At first, she wanted to refuse, but then she changed her mind.'],slots:['felt nervous · I calmed down','wanted to refuse · I changed my mind','did not know what to do · my friend helped me']},{id:'past-decided',cat:'过去故事',cue:'作出决定',start:'I decided to…',shell:'I decided to ___ because ___.',examples:['I decided to go because I might regret missing the chance.','I decided to ask for a day off because it could be their last show.'],slots:['go · I might regret missing it','book the ticket · the show was important','change my plan · the group might disband']},{id:'past-turned',cat:'过去故事',cue:'结果比预期好',start:'In the end…',shell:'In the end, it turned out much ___ than I expected.',examples:['In the end, it turned out much better than I expected.','In the end, the trip was much easier than I expected.'],slots:['better','easier','more enjoyable']},{id:'past-taught',cat:'过去故事',cue:'经历带来的改变',start:'That experience…',shell:'That experience taught me to ___.',examples:['That experience taught me to handle things on my own.','That experience taught me to plan ahead.'],slots:['handle things on my own','plan ahead','stay calm when plans change']},{id:'past-felt',cat:'过去故事',cue:'过去感受',start:'I felt…',shell:'I felt ___ because ___.',examples:['I felt proud because I managed the trip on my own.','I felt grateful because we did not miss that chance.'],slots:['proud · I managed it on my own','grateful · we did not miss the chance','nervous · the hotel cancelled our booking']},{id:'help-told',cat:'人物建议',cue:'告诉某人做什么',start:'I told her to…',shell:'I told her to ___ so that ___.',examples:['I told her to book a safe hotel so that she could get back easily.','I told her to arrive early so that she would have enough time.'],slots:['book a safe hotel · she could get back easily','arrive early · she would have enough time','use a reliable agent · she could avoid trouble']},{id:'help-reminded',cat:'人物建议',cue:'提醒某人',start:'I reminded her to…',shell:'I reminded her to ___ and ___.',examples:['I reminded her to arrive early and prepare what she wanted to say.','I reminded her to check the ticket and keep her phone charged.'],slots:['arrive early · prepare what she wanted to say','check the ticket · keep her phone charged','stay calm · ask for help if needed']},{id:'help-helped',cat:'人物建议',cue:'帮助某人完成事情',start:'I helped her…',shell:'I helped her ___ because ___.',examples:['I helped her plan the trip because she had never travelled alone.','I helped her find a hotel because our first booking was cancelled.'],slots:['plan the trip · she had never travelled alone','find a hotel · the first booking was cancelled','prepare what to say · she was very shy']},{id:'present-known',cat:'现在完成',cue:'认识多久',start:'We have known…',shell:'We have known each other for ___.',examples:['We have known each other for over ten years.','We have known each other since high school.'],slots:['over ten years','a long time','since high school']},{id:'present-learned',cat:'现在完成',cue:'从某人/经历学到',start:'I have learned…',shell:'I have learned a lot from ___.',examples:['I have learned a lot from her.','I have learned a lot from that experience.'],slots:['her','that experience','travelling alone']},{id:'third-makes',cat:'第三人称',cue:'她的习惯 / 影响',start:'She usually…',shell:'She usually ___, and that makes her ___.',examples:['She usually goes to the park, and that makes her happy.','She usually plans everything early, and that makes her feel safe.'],slots:['goes to the park · happy','plans everything early · safe','chats with her friends · relaxed']},{id:'ending-overall',cat:'结尾感受',cue:'最后总结',start:'Overall, I…',shell:'Overall, I think it was ___ because ___.',examples:['Overall, I think it was a valuable experience because it made me braver.','Overall, I think it was worth it because I learned to handle things on my own.'],slots:['a valuable experience · it made me braver','worth it · I learned a lot','a good decision · I did not miss the chance']}];const CATS=['全部',...new Set(DATA.map(x=>x.cat))];let cat='全部',index=0,show=false,listMode=false;const memoryStore={};const storage={getItem(k){try{return localStorage.getItem(k)}catch(_){return memoryStore[k]??null}},setItem(k,v){try{localStorage.setItem(k,v)}catch(_){memoryStore[k]=String(v)}}};const state=JSON.parse(storage.getItem('ielts-shell-state')||'{}');const $=s=>document.querySelector(s);function filtered(){return cat==='全部'?DATA:DATA.filter(x=>x.cat===cat)}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/___/g,'something'));u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}function renderFilters(){const box=$('#filters');box.innerHTML=CATS.map(x=>`<button data-cat="${x}" class="${x===cat?'active':''}">${x}</button>`).join('')}function render(){const arr=filtered();if(index>=arr.length)index=0;$('#count').textContent=`${arr.length} 条主干`;renderFilters();if(listMode){$('#card').hidden=true;$('#list').hidden=false;$('#list').innerHTML=arr.map((x,i)=>`<article class="mini" data-open="${x.id}"><span>${x.cat}</span><b>${x.start}</b><span>${x.cue}</span></article>`).join('');return}$('#list').hidden=true;$('#card').hidden=false;if(!arr.length){$('#card').innerHTML='<div class="empty">没有内容</div>';return}const x=arr[index];const saved=state[x.id]||'';$('#card').innerHTML=`<div class="meta"><div><span class="tag">${x.cat}</span><div class="cue">${x.cue}</div></div><span class="num">${index+1} / ${arr.length}</span></div><div class="starter">${x.start}</div><div class="prompt">先只说绿色主干，再补后半句。</div><div class="shell ${show?'':'hidden'}" id="shell">${x.shell}</div><div class="slots">${x.slots.map(s=>`<span class="slot">${s}</span>`).join('')}</div><div class="examples">${x.examples.map(e=>`<div class="example">${e}</div>`).join('')}</div><div class="actions"><button class="primary" data-action="speak-start">听主干</button><button data-action="speak-full">听例句</button><button data-action="toggle">${show?'隐藏主干':'显示主干'}</button><button data-action="random">随机一条</button></div><div class="status"><button data-state="unstable" class="${saved==='unstable'?'active':''}">还不稳</button><button data-state="two-second" class="${saved==='two-second'?'active':''}">两秒能出</button><button data-state="automatic" class="${saved==='automatic'?'active':''}">已经自动</button></div><div class="drill"><h2>一条主干怎么练</h2><div class="steps"><div class="step"><b>1. 起头</b>只说前4–6词，连续5次。</div><div class="step"><b>2. 替换</b>换3个后半句，主干不变。</div><div class="step"><b>3. 换题</b>用同一主干答3道不同题。</div><div class="step"><b>4. 隔天</b>第二天随机抽，2秒内开口。</div></div></div>`}function next(){const arr=filtered();index=arr.length?(index+1)%arr.length:0;show=false;listMode=false;render()}function random(){const arr=filtered();if(!arr.length)return;let n=Math.floor(Math.random()*arr.length);if(arr.length>1&&n===index)n=(n+1)%arr.length;index=n;show=false;listMode=false;render()}document.addEventListener('click',e=>{const c=e.target.closest('[data-cat]');if(c){cat=c.dataset.cat;index=0;show=false;listMode=false;render();return}const open=e.target.closest('[data-open]');if(open){const arr=filtered();index=Math.max(0,arr.findIndex(x=>x.id===open.dataset.open));listMode=false;show=true;render();return}const st=e.target.closest('[data-state]');if(st){const x=filtered()[index];state[x.id]=st.dataset.state;storage.setItem('ielts-shell-state',JSON.stringify(state));render();return}const a=e.target.closest('[data-action]')?.dataset.action;if(a==='toggle'){show=!show;render()}else if(a==='random')random();else if(a==='speak-start')speak(filtered()[index].start);else if(a==='speak-full')speak(filtered()[index].examples[0])});$('#random').onclick=random;$('#next').onclick=next;$('#showAll').onclick=()=>{listMode=!listMode;render()};render();</script></body></html>
