<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>答案词随身听</title></head><body><script>(async()=>{const files=Array.from({length:16},(_,i)=>`chunks/${String(i).padStart(2,'0')}.txt`);const parts=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(`${f}: ${r.status}`);return r.text()}));const b64=parts.join('');const bin=atob(b64);const u8=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()})().catch(e=>document.body.innerHTML='<pre style="white-space:pre-wrap;padding:24px;font:14px/1.5 system-ui">加载失败：'+e.message+'</pre>')</script></body></html>
