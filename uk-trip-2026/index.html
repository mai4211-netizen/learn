const mapInstances={};
const markerStore={};
function googleMapUrl(p){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.lat+','+p.lng);}
function mapHtml(d){
  const m=MAPS[d.date]; if(!m) return '';
  const h=HOTELS_BY_DATE[d.date];
  const id='map-'+d.date.replace('/','-');
  const hotelCard=h?`<button type="button" class="map-card hotel" data-date="${d.date}" data-kind="hotel"><span class="num">H</span><span>${h.name}<small>当天住宿</small></span></button>`:'';
  return `<section class="map-wrap"><div class="map-head"><b>当天地图 · ${m.title}</b><span>${h?'H = 酒店 · ':''}点地点可定位</span></div><div class="day-map" id="${id}" aria-label="${m.title} 地图"></div><div class="map-cards">${hotelCard}${m.points.map(p=>`<button type="button" class="map-card" data-date="${d.date}" data-n="${p.n}"><span class="num">${p.n}</span><span>${p.name}<small>${p.time}</small></span></button>`).join('')}</div><div class="map-note">${m.note}</div></section>`;
}
function initMaps(){
  if(typeof L==='undefined'){
    document.querySelectorAll('.day-map').forEach(el=>{el.innerHTML='<div style="padding:18px;color:#746f66">地图暂时加载失败；可使用下方地点卡片配合 Google Maps 搜索。</div>';});
    return;
  }
  Object.entries(MAPS).forEach(([date,m])=>{
    const id='map-'+date.replace('/','-'),el=document.getElementById(id); if(!el||mapInstances[date])return;
    const map=L.map(el,{scrollWheelZoom:false,zoomControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    const markers={};
    const h=HOTELS_BY_DATE[date];
    if(h){
      const hIcon=L.divIcon({className:'',html:'<div class="hotel-pin">H</div>',iconSize:[24,24],iconAnchor:[12,12]});
      const hm=L.marker([h.lat,h.lng],{icon:hIcon}).addTo(map);
      hm.bindPopup(`<div class="map-popup"><b>H · ${h.name}</b><br><span>当天住宿</span><br><a href="${googleMapUrl(h)}" target="_blank" rel="noopener">Google Maps ↗</a></div>`);
      markers.H=hm;
    }
    const latlngs=m.points.map(p=>{
      const icon=L.divIcon({className:'',html:`<div class="map-pin">${p.n}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
      const marker=L.marker([p.lat,p.lng],{icon}).addTo(map);
      marker.bindPopup(`<div class="map-popup"><b>${p.n}. ${p.name}</b><br><span>${p.time}</span><br><a href="${googleMapUrl(p)}" target="_blank" rel="noopener">Google Maps ↗</a></div>`);
      markers[p.n]=marker;
      return [p.lat,p.lng];
    });
    if(latlngs.length>1)L.polyline(latlngs,{color:'#5d5850',weight:2,opacity:.6,dashArray:'6 7'}).addTo(map);
    const bounds=L.latLngBounds(latlngs);
    if(h && latlngs.length){
      const center=bounds.getCenter();
      const sameArea=Math.abs(center.lat-h.lat)<0.12 && Math.abs(center.lng-h.lng)<0.18;
      if(sameArea) bounds.extend([h.lat,h.lng]);
    }
    map.fitBounds(bounds.pad(.22),{maxZoom:15});
    mapInstances[date]=map; markerStore[date]=markers;
  });
  document.querySelectorAll('.map-card').forEach(btn=>btn.addEventListener('click',()=>{
    const date=btn.dataset.date,map=mapInstances[date];
    const key=btn.dataset.kind==='hotel'?'H':Number(btn.dataset.n);
    const m=markerStore[date]?.[key];
    if(m&&map){map.setView(m.getLatLng(),Math.max(map.getZoom(),15),{animate:true});m.openPopup();}
  }));
  document.querySelectorAll('.row[data-map-n]').forEach(row=>row.addEventListener('click',()=>{
    const date=row.dataset.date,n=Number(row.dataset.mapN),m=markerStore[date]?.[n],map=mapInstances[date];
    if(m&&map){map.setView(m.getLatLng(),Math.max(map.getZoom(),15),{animate:true});m.openPopup();}
  }));
}

const daysEl=document.getElementById('days');
const cls=c=>c.includes('Edinburgh')?'edin':c.includes('Stirling')?'stir':c.includes('East Sussex')?'east':'lon';
function render(){daysEl.innerHTML=DATA.map(d=>{const m=MAPS[d.date];return `<article class="day" data-city="${d.city}" data-date="${d.date}" data-search="${(d.theme+' '+d.items.flat().join(' ')).toLowerCase()}"><div class="head"><div class="left"><div class="date ${cls(d.city)}"><b>${d.date}</b><span>${d.city}</span></div><div class="title"><h2>${d.theme}</h2><p>${d.city}</p></div></div><div class="meta"><span class="pill">强度 ${d.intensity}</span><span class="pill">${d.mode}</span></div><div class="chev">⌄</div></div><div class="body">${d.items.map((x,idx)=>{const p=m?.points.find(p=>p.i===idx);return `<div class="row ${p?'map-linked':''}" ${p?`data-date="${d.date}" data-map-n="${p.n}"`:''}><div class="time">${x[0]}</div><div class="place"><b>${x[1]}</b><small>${x[2]||''}</small></div><div class="move"><b>${x[3]||''}</b></div></div>`;}).join('')}${mapHtml(d)}<div class="note">${d.note}</div></div></article>`;}).join('');document.querySelectorAll('.head').forEach(h=>h.onclick=()=>{h.parentElement.classList.toggle('collapsed');setTimeout(()=>Object.values(mapInstances).forEach(m=>m.invalidateSize()),80);});initMaps();}
render();
let city='all',date='all';
function apply(){const q=document.getElementById('q').value.trim().toLowerCase();let n=0;document.querySelectorAll('.day').forEach(el=>{const okCity=city==='all'||el.dataset.city===city;const okDate=date==='all'||el.dataset.date===date;const okQ=!q||(el.dataset.search+' '+el.innerText.toLowerCase()).includes(q);const ok=okCity&&okDate&&okQ;el.classList.toggle('hidden',!ok);if(ok)n++});document.getElementById('empty').style.display=n?'none':'block';setTimeout(()=>Object.values(mapInstances).forEach(m=>m.invalidateSize()),60);}
document.getElementById('q').oninput=apply;
document.querySelectorAll('#cityFilters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#cityFilters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');city=b.dataset.city;apply();});
document.querySelectorAll('#dateFilters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dateFilters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');date=b.dataset.date;apply();});
</script></body></html>
