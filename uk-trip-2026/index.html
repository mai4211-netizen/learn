<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UK Trip 2026｜行程检索版</title>
<style>
:root{--bg:#f4f1eb;--paper:#fffdfa;--ink:#22221f;--muted:#746f66;--line:#ddd6ca;--dark:#252520;--edin:#587589;--stir:#788b58;--lon:#a05d50}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1120px;margin:auto;padding:16px}.hero{background:var(--dark);color:white;border-radius:22px;padding:22px}.hero h1{font-size:clamp(30px,5vw,50px);line-height:1;margin:8px 0}.hero p{font-size:12px;opacity:.72;margin:0}
.sticky{position:sticky;top:0;z-index:20;background:rgba(244,241,235,.94);backdrop-filter:blur(8px);padding:10px 0}
.search{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:white;font-size:14px;outline:none}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}button{border:0;background:#ded8ce;border-radius:999px;padding:7px 10px;font-weight:750;font-size:10px;cursor:pointer}button.active{background:var(--dark);color:white}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:9px;color:var(--muted)}
.day{background:var(--paper);border:1px solid var(--line);border-radius:17px;margin:9px 0;overflow:hidden}.day.hidden{display:none}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;cursor:pointer}
.left{display:flex;align-items:center;gap:10px}.date{width:58px;min-width:58px;color:white;border-radius:12px;text-align:center;padding:8px 5px}.date b{display:block;font-size:17px;line-height:1}.date span{font-size:8px;opacity:.8}
.edin{background:var(--edin)}.stir{background:var(--stir)}.lon{background:var(--lon)}.title h2{margin:0 0 3px;font-size:16px}.title p{margin:0;color:var(--muted);font-size:10px}.meta{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#eee9df;border-radius:999px;padding:4px 6px;font-size:8.5px}.chev{color:#888}
.body{border-top:1px solid var(--line);padding:7px 13px 12px}.collapsed .body{display:none}
.row{display:grid;grid-template-columns:100px 1fr 170px;gap:8px;padding:9px 4px;border-bottom:1px dashed #e2dbcf;font-size:10.5px}.row:last-child{border-bottom:0}.time{font-weight:900}.place b{display:block;font-size:12px}.place small{color:var(--muted)}.move{color:#5d5850}.move b{display:block;color:var(--ink)}
.note{background:#f1ece3;border-radius:9px;padding:8px;margin-top:8px;font-size:9.5px;color:#5d5851}.empty{display:none;text-align:center;padding:25px;color:var(--muted)}
@media(max-width:760px){.summary{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:78px 1fr}.move{grid-column:2}.meta{display:none}}
</style></head>
<body><div class="wrap">
<section class="hero"><div style="font-size:9px;letter-spacing:.16em;opacity:.55">30 SEP — 12 OCT 2026</div><h1>行程检索版</h1><p>搜索景点 / 日期 / 城市；每天可折叠。到达时间、浏览时长和交通放在同一行。</p></section>
<div class="sticky">
<input id="q" class="search" placeholder="搜索：大英博物馆 / V&A / 白崖 / 音乐剧 / 城堡 / café…">
<div class="filters" id="cityFilters"><button class="active" data-city="all">全部城市</button><button data-city="Edinburgh">Edinburgh</button><button data-city="Stirling / Gargunnock">Stirling</button><button data-city="London">London</button><button data-city="Dover">Dover</button></div>
<div class="filters" id="dateFilters"><button class="active" data-date="all">全部日期</button><button data-date="9/30">9/30</button><button data-date="10/1">10/1</button><button data-date="10/2">10/2</button><button data-date="10/3">10/3</button><button data-date="10/4">10/4</button><button data-date="10/5">10/5</button><button data-date="10/6">10/6</button><button data-date="10/7">10/7</button><button data-date="10/8">10/8</button><button data-date="10/9">10/9</button><button data-date="10/10">10/10</button><button data-date="10/11">10/11</button><button data-date="10/12">10/12</button></div>
</div>
<div class="summary"><div class="stat"><b>13 天</b><span>9/30 → 10/12</span></div><div class="stat"><b>1 天留白</b><span>10/3</span></div><div class="stat"><b>3 个重日</b><span>10/1 · 10/8 · 10/10</span></div><div class="stat"><b>1 次一日游</b><span>Dover 白崖</span></div></div>
<main id="days"></main><div id="empty" class="empty">没有匹配结果。</div>
</div>
<script>
const DATA=[{"date":"9/30","city":"Edinburgh","theme":"城市方位入门","intensity":"★★","mode":"步行","items":[["15:00","Waverley Bridge｜威弗利桥","10–15min","步行 3min"],["15:15","Scott Monument｜司各特纪念塔","外观 15min；登塔 40–50min","步行 3–5min"],["15:40","Princes Street Gardens｜王子街花园","30–45min","花园内步行 12–15min"],["16:30","Ross Fountain｜罗斯喷泉","15–20min","之后 café / 晚饭 / 回住宿"]],"note":"抵达半天，只做 orientation，不安排大型室内景点。"},{"date":"10/1","city":"Edinburgh","theme":"Old Town 历史主日","intensity":"★★★★","mode":"步行","items":[["09:20","到 Edinburgh Castle｜爱丁堡城堡","提前到门口",""],["09:30–12:00","Edinburgh Castle｜爱丁堡城堡","2.5h","步行下坡约 8min"],["12:10–13:00","Grassmarket 一带午餐","50min","步行"],["13:00–13:25","Victoria Street｜维多利亚街","20–25min","步行 10–12min"],["13:40–16:30","National Museum of Scotland｜苏格兰国家博物馆","约 2h50min","步行 20–25min"],["17:10–18:10","Calton Hill｜卡尔顿山","45–60min","步行 / 公交回住宿"]],"note":"真正耗体力的是 Castle + National Museum；其余都属于轻量节点。"},{"date":"10/2","city":"Edinburgh","theme":"艺术半日","intensity":"★★","mode":"步行","items":[["10:00–12:30/13:00","Scottish National Gallery｜苏格兰国家美术馆","2.5–3h","之后午餐 / 自由散步"]],"note":"只安排一个主馆。"},{"date":"10/3","city":"Edinburgh","theme":"留白","intensity":"☆","mode":"自由","items":[["全天","自由日","不安排固定行程",""]],"note":"天气、体力、临时想去的店或补漏都放这天。"},{"date":"10/4","city":"Stirling / Gargunnock","theme":"历史 + 乡村","intensity":"★★★","mode":"自驾 / Taxi + 步行","items":[["08:55","Gargunnock House 出发","","车 / Taxi 15–20min"],["09:30–12:00","Stirling Castle｜斯特灵城堡","2.5h","步行 5min"],["12:05–12:30","Church of the Holy Rude｜圣鲁德教堂","20–25min","步行"],["12:30–13:30","Stirling Old Town｜斯特灵老城 + 午餐","1h","回停车处约 10min"],["13:45","Stirling → Gargunnock","","开车约 15–20min"],["14:10–16:00","Downie’s Loup Waterfall Walk｜唐尼斯卢普瀑布短线","1.5–2h","步行"]],"note":"天气差时，把瀑布短线换成 The National Wallace Monument｜国家华莱士纪念碑。"},{"date":"10/5","city":"London","theme":"抵达 + 经典地标半天","intensity":"★★","mode":"火车 + 步行","items":[["08:00 左右","Stirling → London","","火车约 5.5–6h"],["13:30–15:00","抵达 London + 酒店放行李","","Tube / Taxi 20–40min"],["15:30","Big Ben｜大本钟","15min","步行"],["15:45","Houses of Parliament｜英国国会大厦","外观 10–15min","步行 5min"],["16:05","Westminster Abbey｜威斯敏斯特教堂","外观 15–20min","步行 5min"],["16:30","Westminster Bridge｜威斯敏斯特桥","15min","步行"],["16:50–17:20","Whitehall｜白厅","边走边看","步行约 15min"],["17:30","Trafalgar Square｜特拉法加广场","20–30min","步行 10–12min"],["18:10","Piccadilly Circus｜皮卡迪利广场","15min","步行 5–8min"],["18:30 后","Chinatown｜伦敦唐人街","晚饭",""]],"note":"如果火车延误，直接删后面的 Piccadilly / Chinatown，不影响核心。"},{"date":"10/6","city":"London","theme":"V&A + Citywalk / Café / Shopping","intensity":"★★★","mode":"Tube + 步行","items":[["10:00–13:30","V&A｜维多利亚与阿尔伯特博物馆","3.5h",""],["13:30–14:30","South Kensington｜南肯辛顿","午餐 / café 1h","Tube 20–25min"],["15:00","Marylebone｜马里波恩","","步行"],["15:10–15:40","Daunt Books｜道特书店","30min","步行 3–5min"],["15:40–16:30","Marylebone High Street｜马里波恩高街","40–50min",""],["16:30–17:15","café","45min","Tube / 步行约 15min"],["17:30–18:15","Liberty London｜自由百货","30–45min","步行 2–5min"],["18:15–18:45","Carnaby Street｜卡纳比街","30min","步行 5min"],["18:45 后","Soho｜苏活区","晚饭 + 随意逛",""]],"note":"下午不要求全部打卡；累了直接删后面的购物点。"},{"date":"10/7","city":"London","theme":"公园 + 西区音乐剧","intensity":"★★","mode":"步行 + Tube","items":[["10:00","Kensington Gardens｜肯辛顿花园","","步行"],["10:05–10:25","Italian Gardens｜意大利花园","20min","步行 15min"],["10:45–11:15","Kensington Palace｜肯辛顿宫","外观 30min","步行 15min"],["11:30–11:50","Albert Memorial｜阿尔伯特纪念碑","20min","步行 10min"],["12:00–13:00","Serpentine｜蛇形湖一带","午餐 / café 1h","步行"],["13:00–13:45","Serpentine Galleries｜蛇形画廊","30–45min，可跳过","步行"],["14:00–15:30","Hyde Park｜海德公园","1–1.5h","Tube 15–30min"],["15:30–17:00","回酒店 / café 休息","1–1.5h",""],["17:15–18:30","West End 附近早晚餐","","步行 / Tube 10–20min"],["19:30–约22:00","West End Musical｜西区音乐剧","约 2.5h",""]],"note":"Green Park / St James’s Park 不硬加；当天觉得太轻再临时走。"},{"date":"10/8","city":"London","theme":"British Museum｜大英博物馆日","intensity":"★★★★","mode":"步行","items":[["09:45","到 British Museum｜大英博物馆","预留安检",""],["10:00–13:00","British Museum 前半段","Bayeux / Egypt / Mesopotamia",""],["13:00–14:00","午饭 + 坐着休息","1h",""],["14:00–16:00","British Museum 后半段","Greece / Asia 按兴趣","步行 8min"],["16:15","Russell Square｜罗素广场","20–30min","步行 7–8min"],["16:50","Senate House｜参议院大楼","外观 10–15min","步行"],["17:10 后","Bloomsbury｜布鲁姆斯伯里","café / 书店",""]],"note":"大英总计约 5 小时，不再安排第二个正式博物馆。"},{"date":"10/9","city":"London","theme":"National Gallery + 城市散步","intensity":"★★★","mode":"步行","items":[["10:00–13:00","National Gallery｜英国国家美术馆","3h",""],["13:00–13:20","Trafalgar Square｜特拉法加广场","20min","步行 10–12min"],["13:30–14:30","午餐","1h",""],["14:30–16:00","Covent Garden｜考文特花园","1–1.5h","步行 8–10min"],["16:10–17:00","Somerset House｜萨默塞特宫","40–50min","步行 10–12min"],["17:15","Seven Dials｜七面钟","30min，可选",""]],"note":"如果看 Renoir and Love，直接从 National Gallery 的 3 小时里分约 1–1.25h。"},{"date":"10/10","city":"Dover","theme":"Dover Castle + White Cliffs","intensity":"★★★★","mode":"火车 + Taxi + 步行","items":[["07:45–08:00","到 London St Pancras","","Tube"],["08:15–08:30","London → Dover Priory","","Southeastern Highspeed 约 1h05–1h15"],["09:25–09:40","抵达 Dover Priory","","Taxi 约 10min"],["10:00–13:00","Dover Castle｜多佛城堡","3h","Taxi 10–15min"],["13:15–13:45","简单午餐","30min",""],["13:45–16:30","White Cliffs of Dover｜多佛白崖","2.5–3h","步行"],["16:30","White Cliffs → Dover Priory","","Taxi 10–15min"],["17:15–18:45 左右","Dover → London","","火车约 1h07"]],"note":"South Foreland Lighthouse 不设成“必须走到”；10 月风大时以主要观景段为准。"},{"date":"10/11","city":"London","theme":"Barbican + East London","intensity":"★★☆","mode":"步行 + 公交 / Tube","items":[["10:30–12:00","Barbican Centre｜巴比肯艺术中心","1–1.5h","步行"],["12:00–12:40","Barbican Estate｜巴比肯住宅区","30–40min","步行 / 公交约 15min"],["13:00–14:00","午饭","1h",""],["14:00","Old Street｜老街","经过即可","步行约 15min"],["14:20–15:30","Shoreditch｜肖尔迪奇","1h+","步行"],["15:30–17:00","Brick Lane｜砖巷","1–1.5h","步行约 10min"],["17:10–18:30","Old Spitalfields Market｜老斯皮塔菲尔德市场","约 1h","Tube 回酒店"]],"note":"重点是城市规划 → 创意街区 → 市场，不是景点打卡。"},{"date":"10/12","city":"London","theme":"返程","intensity":"—","mode":"机场交通","items":[["按航班","酒店 → 机场","国际航班建议起飞前约 3 小时到机场","待机场 / 航班确定后补精确时间"]],"note":"不安排正式景点。"}];
const daysEl=document.getElementById('days');
const cls=c=>c.includes('Edinburgh')?'edin':c.includes('Stirling')?'stir':'lon';
function render(){
  daysEl.innerHTML=DATA.map((d,i)=>`<article class="day" data-city="${d.city}" data-date="${d.date}" data-search="${(d.theme+' '+d.items.flat().join(' ')).toLowerCase()}">
    <div class="head"><div class="left"><div class="date ${cls(d.city)}"><b>${d.date}</b><span>${d.city}</span></div><div class="title"><h2>${d.theme}</h2><p>${d.city}</p></div></div><div class="meta"><span class="pill">强度 ${d.intensity}</span><span class="pill">${d.mode}</span></div><div class="chev">⌄</div></div>
    <div class="body">${d.items.map(x=>`<div class="row"><div class="time">${x[0]}</div><div class="place"><b>${x[1]}</b><small>${x[2]||''}</small></div><div class="move"><b>${x[3]||''}</b></div></div>`).join('')}<div class="note">${d.note}</div></div>
  </article>`).join('');
  document.querySelectorAll('.head').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('collapsed'));
}
render();
let city='all', date='all';
function apply(){
  const q=document.getElementById('q').value.trim().toLowerCase(); let n=0;
  document.querySelectorAll('.day').forEach(el=>{
    const okCity=city==='all'||el.dataset.city===city;
    const okDate=date==='all'||el.dataset.date===date;
    const okQ=!q||(el.dataset.search+' '+el.innerText.toLowerCase()).includes(q);
    const ok=okCity&&okDate&&okQ; el.classList.toggle('hidden',!ok); if(ok)n++;
  });
  document.getElementById('empty').style.display=n?'none':'block';
}
document.getElementById('q').oninput=apply;
document.querySelectorAll('#cityFilters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#cityFilters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');city=b.dataset.city;apply();});
document.querySelectorAll('#dateFilters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dateFilters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');date=b.dataset.date;apply();});
</script></body></html>
