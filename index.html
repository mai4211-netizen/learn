<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f9">
  <title>IELTS 阅读考点词 · 原始数据重构版</title>
  <link rel="stylesheet" href="./styles.css?v=20260731-r4">
  <link rel="stylesheet" href="./responsive.css?v=20260731-r4">
  <link rel="stylesheet" href="./enhancements.css?v=20260731-r4">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="topline">
        <div class="brand">
          <div class="eyebrow">IELTS READING · SOURCE REBUILD</div>
          <h1>阅读考点词</h1>
          <p id="brand-subtitle">376 个核心条目 · 按原始 PDF 重构</p>
        </div>
        <nav class="tabs" aria-label="学习视图" role="tablist">
          <button class="tab active" data-view="card" type="button" role="tab" aria-selected="true">卡片</button>
          <button class="tab" data-view="list" type="button" role="tab" aria-selected="false">列表</button>
          <button class="tab" data-view="review" type="button" role="tab" aria-selected="false">自测</button>
        </nav>
      </div>

      <details class="source-note" id="source-note">
        <summary>
          <span class="source-dot" aria-hidden="true"></span>
          <span id="source-note-summary">数据口径说明</span>
          <span class="source-note-count" id="audit-count"></span>
        </summary>
        <div class="source-note-body">
          <p id="method-note"></p>
          <p id="audit-note"></p>
          <p class="source-origin">来源：<span id="source-origin"></span></p>
        </div>
      </details>

      <div class="controls">
        <label class="search-wrap" for="search-input">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" autocomplete="off" placeholder="搜索英文 / 中文 / 原书关联表达">
        </label>
        <div class="scope" role="group" aria-label="分类筛选">
          <button class="scope-btn active" type="button" data-category="all">全部</button>
          <button class="scope-btn" type="button" data-category="1">C1</button>
          <button class="scope-btn" type="button" data-category="2">C2</button>
          <button class="scope-btn" type="button" data-category="3">C3</button>
        </div>
        <button class="audit-filter" id="audit-filter" type="button" aria-pressed="false">只看疑点</button>
        <button class="missed-filter" id="missed-filter" type="button" aria-pressed="false">只看错词 0</button>
        <details class="voice-menu">
          <summary>发音</summary>
          <div class="voice-popover">
            <label for="voice-select">浏览器声音</label>
            <select id="voice-select"><option value="">自动选择</option></select>
            <label for="speech-rate">语速 <span id="rate-value">0.86×</span></label>
            <input id="speech-rate" type="range" min="0.65" max="1.05" value="0.86" step="0.01">
          </div>
        </details>
      </div>
    </header>

    <main class="main-stage">
      <section class="view active" id="card-view" data-view-panel="card" aria-live="polite">
        <div class="study-card" id="study-card">
          <div class="card-topline">
            <div class="meta-badges" id="card-badges"></div>
            <span class="source-page" id="card-source-page"></span>
          </div>
          <div class="term-row">
            <button class="term-button" id="card-term" type="button" aria-label="播放单词发音">loading</button>
            <button class="speak-button" id="card-speak" type="button" aria-label="播放发音">▶</button>
          </div>
          <div class="study-meaning" id="card-meaning"></div>

          <div class="card-section">
            <div class="section-head">
              <span>原书“真题命题方式”</span>
              <span class="section-hint">只作为题目中的关联表达，不默认可互换</span>
            </div>
            <div class="mapping-chips" id="card-mappings"></div>
          </div>

          <div class="audit-box hidden" id="card-audit">
            <div class="audit-title" id="card-audit-title"></div>
            <div class="audit-text" id="card-audit-text"></div>
          </div>

          <details class="source-row" id="source-row">
            <summary>查看原书对照</summary>
            <div class="source-raw-grid">
              <div><span>考点词（原书）</span><strong id="source-term"></strong></div>
              <div><span>常考中文词义（原书）</span><strong id="source-meaning"></strong></div>
              <div class="source-raw-wide"><span>命题方式（原书）</span><strong id="source-mapping"></strong></div>
            </div>
          </details>
        </div>
      </section>

      <section class="view" id="list-view" data-view-panel="list" aria-live="polite">
        <div class="list-header">
          <div><strong id="list-count">0</strong> 条</div>
          <div class="list-legend"><span class="legend-dot danger"></span>明确错误 <span class="legend-dot warn"></span>需按语境 <span class="legend-dot" style="background:var(--info)"></span>结构考点</div>
        </div>
        <div class="word-list" id="word-list"></div>
      </section>

      <section class="view" id="review-view" data-view-panel="review" aria-live="polite">
        <div class="review-toolbar">
          <div class="review-direction" role="group" aria-label="自测方向">
            <button class="review-mode active" type="button" data-review-mode="en">英文 → 中文</button>
            <button class="review-mode" type="button" data-review-mode="zh">中文 → 英文</button>
          </div>
          <button class="secondary-button" id="restart-review" type="button">重新洗牌</button>
        </div>

        <div class="review-card" id="review-card">
          <div class="review-kicker" id="review-kicker"></div>
          <button class="review-question" id="review-question" type="button"></button>
          <div class="review-answer-wrap hidden" id="review-answer-wrap">
            <div class="review-answer" id="review-answer"></div>
            <div class="review-mapping" id="review-mapping"></div>
            <div class="review-audit hidden" id="review-audit"></div>
          </div>
          <button class="reveal-button" id="reveal-answer" type="button">显示答案</button>
          <div class="review-actions hidden" id="review-actions">
            <button class="miss-button" id="mark-missed" type="button">没记住</button>
            <button class="know-button" id="mark-known" type="button">记得</button>
          </div>
        </div>
        <div class="review-progress" id="review-progress"></div>
        <div class="review-shortcuts">空格/Enter 显示答案 · ←/1 没记住 · →/2 记得 · / 搜索</div>
      </section>
    </main>

    <footer class="card-footer" id="card-footer">
      <button class="nav-button" id="prev-card" type="button" aria-label="上一个">←</button>
      <div class="progress-copy">
        <strong id="card-progress">0 / 0</strong>
        <span id="card-progress-sub">原始 PDF · 376 核心条目</span>
      </div>
      <button class="nav-button" id="next-card" type="button" aria-label="下一个">→</button>
    </footer>
  </div>

  <script src="./data.js?v=20260731-r3"></script>
  <script src="./corrections-v2.js?v=20260731-r4"></script>
  <script src="./app.js?v=20260731-r4"></script>
</body>
</html>
