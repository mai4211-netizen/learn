<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS 写作模板默写</title>
<style>
:root{--bg:#f7f5f2;--paper:#fff;--ink:#27242a;--muted:#756f79;--line:#e6dfda;--violet:#5c4a82;--light:#eeeaf7;--good:#197447;--bad:#ad3344}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:9;background:#f7f5f2ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head{max-width:1120px;margin:auto;padding:15px 22px 11px;display:flex;justify-content:space-between;gap:16px;align-items:center}
h1{margin:0;font-size:21px}.sub,#score{font-size:12px;color:var(--muted)}
.head-tools{display:flex;align-items:center;gap:12px}.timer{display:flex;align-items:center;gap:6px}.timer-name{font-size:12px;color:var(--muted)}
#timerDisplay{min-width:5ch;font:600 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;text-align:center}
.timer-button{width:34px;height:34px;border:1px solid #d8d0df;background:#fff;border-radius:8px;color:var(--ink);font-size:14px;cursor:pointer}
nav{max-width:1120px;margin:auto;padding:0 22px 12px;display:flex;gap:7px;overflow:auto}
nav button{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--muted);border-radius:99px;padding:7px 11px;cursor:pointer}
nav button.active{background:var(--violet);border-color:var(--violet);color:#fff}
main{max-width:960px;margin:auto;padding:28px 22px 64px}
section{display:none}section.active{display:block}
h2{margin:0 0 4px;font-size:25px}.intro{color:var(--muted);margin:0 0 24px}
h3{font-size:16px;border-bottom:1px solid var(--line);padding-bottom:8px;margin:30px 0 10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:15px;margin:10px 0}
.prompt{font-weight:650;margin-bottom:9px;white-space:pre-line}
.row{display:flex;gap:8px}
textarea{width:100%;min-height:46px;resize:none;overflow:hidden;border-radius:8px;border:1px solid #d8d0df;padding:10px;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
textarea:focus{outline:0;border-color:var(--violet);box-shadow:0 0 0 3px var(--light)}
.icon{flex:0 0 42px;height:42px;border:1px solid #d8d0df;background:#fff;border-radius:8px;font-size:17px;cursor:pointer}
.icon:focus-visible,.timer-button:focus-visible,nav button:focus-visible{outline:3px solid var(--light);outline-offset:2px;border-color:var(--violet)}
.feedback{display:none;margin-top:9px;padding:9px 10px;border-radius:8px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
.good{display:block;background:#eaf8ef;color:var(--good);border:1px solid #c9ead5}
.bad{display:block;background:#fff;color:var(--ink);border:1px solid var(--line)}
.answer{color:#5c525c;margin-top:5px}.reference{font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;background:#f8f7f5;border:1px solid #ede8e3;padding:9px 10px;border-radius:8px;margin-top:6px}
.diff-label{margin-top:6px;color:var(--muted)}.diff-bad,.diff-missing{color:var(--bad);background:#fff0f2;border-bottom:2px solid var(--bad);border-radius:3px;padding:0 1px}.diff-missing{font-size:.9em;white-space:nowrap}.diff-good{color:var(--good);background:#eaf8ef;border-bottom:2px solid var(--good);border-radius:3px;padding:0 1px}
.slot{color:#5c4a82;background:#f1edf7;border:1px dashed #cfc4df;border-radius:4px;padding:0 5px}
@media(max-width:600px){.head{display:block;padding:13px 15px}.head-tools{margin-top:8px;justify-content:space-between}.timer-name{display:none}nav{padding:0 15px 11px}main{padding:22px 15px}}
</style>
</head>

function diffPieces(s){return String(s).match(/[A-Za-z]+(?:'[A-Za-z]+)?|\d+(?:\.\d+)?|\s+|[^\s]/g)||[]}
function isDiffWord(s){return /^(?:[A-Za-z]+(?:'[A-Za-z]+)?|\d+(?:\.\d+)?)$/.test(s)}
function diffIndexes(pieces,ignoreSymbols){let out=[];pieces.forEach((token,index)=>{if(/^\s+$/.test(token))return;if(ignoreSymbols&&!isDiffWord(token))return;out.push(index)});return out}
function markBad(s){return '<span class="diff-bad">'+esc(s)+'</span>'}
function markMissing(s){return '<span class="diff-missing">缺 '+esc(s)+'</span>'}
function markGood(s){return '<span class="diff-good">'+esc(s)+'</span>'}
function diffChars(input,reference){let a=[...input],b=[...reference],start=0;while(start<a.length&&start<b.length&&a[start].toLowerCase()===b[start].toLowerCase())start++;let endA=a.length-1,endB=b.length-1;while(endA>=start&&endB>=start&&a[endA].toLowerCase()===b[endB].toLowerCase()){endA--;endB--}let preA=a.slice(0,start).join(''),preB=b.slice(0,start).join(''),midA=a.slice(start,endA+1).join(''),midB=b.slice(start,endB+1).join(''),sufA=a.slice(endA+1).join(''),sufB=b.slice(endB+1).join('');return {input:esc(preA)+(midA?markBad(midA):midB?markMissing(midB):'')+esc(sufA),reference:midB?esc(preB)+markGood(midB)+esc(sufB):midA?markGood(reference):esc(reference)}}
function diffKey(token,ignoreSymbols){let trendKey=trendWordKey(token);if(trendKey)return trendKey;return ignoreSymbols?loose(token):token.toLowerCase()}
function diffPair(input,reference,ignoreSymbols){let a=diffPieces(input),b=diffPieces(reference),ai=diffIndexes(a,ignoreSymbols),bi=diffIndexes(b,ignoreSymbols),av=ai.map(index=>diffKey(a[index],ignoreSymbols)),bv=bi.map(index=>diffKey(b[index],ignoreSymbols)),dp=Array.from({length:av.length+1},()=>Array(bv.length+1).fill(0));for(let i=av.length-1;i>=0;i--)for(let j=bv.length-1;j>=0;j--)dp[i][j]=av[i]===bv[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);let matches=[],i=0,j=0;while(i<av.length&&j<bv.length){if(av[i]===bv[j]){matches.push([i,j]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}let ar=a.map(esc),br=b.map(esc),prevA=-1,prevB=-1;for(const [nextA,nextB] of [...matches,[ai.length,bi.length]]){let aSeg=ai.slice(prevA+1,nextA),bSeg=bi.slice(prevB+1,nextB),max=Math.max(aSeg.length,bSeg.length);for(let k=0;k<max;k++){let ax=aSeg[k],bx=bSeg[k];if(ax!==undefined&&bx!==undefined){let d=diffChars(a[ax],b[bx]);ar[ax]=d.input;br[bx]=d.reference}else if(ax!==undefined)ar[ax]=markBad(a[ax]);else if(bx!==undefined)br[bx]=markGood(b[bx])}prevA=nextA;prevB=nextB}return {input:ar.join(''),reference:br.join('')}}
function stripFreeSlots(s){return String(s).replace(/\s*\[\[free:[^\]]+\]\]/g,'')}
function stripLikelyFreeValues(s,answer){let out=String(s).replace(/\b\d+(?:\.\d+)?%?/g,'').replace(/%/g,'').replace(/\b[A-Za-z]+\s+(?=users\b)/g,'');if(String(answer).includes('[[free:国家]]'))out=out.replace(/\b(in|for|of)\s+(?:the\s+)?(?:[A-Z]{2,}|[A-Z][a-z]+)\b/gi,'$1');if(String(answer).includes('[[free:器具]]'))out=out.replace(/\b(in|by)\s+the\s+[a-z]+\b/gi,'$1 the');if(String(answer).includes('[[free:结果]]'))out=out.replace(/\binto\s+[a-z]+\b/gi,'into');if(String(answer).includes('[[free:材料]]'))out=out.replace(/^\s*[a-z]+\s+(?=is\b)/i,'');return out.replace(/\s+/g,' ').trim()}
function fixedInputForDiff(answer,value){let target=trimFinalPunctuation(answer),input=trimFinalPunctuation(value),out='^',i=0,slots=/\[\[free:[^\]]+\]\]/g,m,captures=0;while((m=slots.exec(target))){let part=target.slice(i,m.index).replace(/\s+$/,'');if(part){out+='('+strictLiteral(part)+')';captures++}out+='\\s*[\\s\\S]*?';i=m.index+m[0].length}let tail=target.slice(i);if(tail){out+='('+strictLiteral(tail)+')';captures++}let match=input.match(new RegExp(out+'$','i'));if(match&&captures)return match.slice(1,captures+1).join('');return stripLikelyFreeValues(input,answer)}
function lineTokens(s){return (String(s).match(/[A-Za-z]+/g)||[]).map(w=>abbrev(w))}
function lineScore(a,b){let tokens=lineTokens(b),score=0;for(const word of lineTokens(a)){let index=tokens.indexOf(word);if(index>=0){score++;tokens.splice(index,1)}}return score}
function alignLooseLineReference(value,reference){if(!String(reference).includes('\n'))return reference;let inputs=String(value).split(/\n+/).filter(x=>x.trim()),refs=String(reference).split(/\n+/).filter(x=>x.trim()),used=new Set(),ordered=[];for(const input of inputs){let best=-1,bestScore=-1;refs.forEach((ref,index)=>{if(used.has(index))return;let score=lineScore(input,ref);if(score>bestScore){best=index;bestScore=score}});if(best>=0){used.add(best);ordered.push(refs[best])}}refs.forEach((ref,index)=>{if(!used.has(index))ordered.push(ref)});return ordered.join('\n')}
function wrongFeedback(value,answer,mode){let ref=Array.isArray(answer)?answer.join(' '):answer,ignoreSymbols=mode==='strict_ignore_symbols',diffRef=ignoreSymbols?strictIgnoreSymbolsText(ref):ref,diffValue=ignoreSymbols?strictIgnoreSymbolsText(value):value;if(ref.includes('[[free:')&&(mode==='strict'||ignoreSymbols)){let fixed=fixedInputForDiff(diffRef,diffValue),reference=alignTrendReference(fixed,trimFinalPunctuation(stripFreeSlots(diffRef))),diff=diffPair(fixed,reference,ignoreSymbols);return '需要调整。<div class="diff-label">你的输入：</div><div class="reference">'+diff.input+'</div><div class="diff-label">参考结构：</div><div class="reference">'+diff.reference+'</div><div class="diff-label">完整结构：</div><div class="reference">'+skeleton(ref)+'</div>'}let alignedRef=mode==='loose'?alignLooseLineReference(value,ref):diffRef,diff=diffPair(diffValue,alignedRef,mode==='loose'||ignoreSymbols);return '需要调整。<div class="diff-label">你的输入：</div><div class="reference">'+diff.input+'</div><div class="diff-label">参考结构：</div><div class="reference">'+diff.reference+'</div>'}
const cats=DATA.categories.filter(cat=>(cat.cards||[]).some(card=>card.include!==false));
const nav=document.getElementById('nav'),app=document.getElementById('app');
cats.forEach((cat,ci)=>{
  let b=document.createElement('button');
  b.textContent=cat.name;
  b.className=ci===0?'active':'';
  b.onclick=()=>show(ci);
  nav.appendChild(b);
  let sec=document.createElement('section'),intro=cat.id==='figure_1_sentence_patterns'?'只考句型行；例句和造句不纳入。':cat.id==='task_1_keywords'?'同一提示下的多个关键词填在一个框里，空格分隔，顺序不限。':cat.id==='task_2_essay'||cat.id==='report'?'':'每句可单独确认。';
  sec.id='s'+ci;
  sec.className=ci===0?'active':'';
  sec.innerHTML='<h2>'+esc(cat.name)+'</h2>'+(intro?'<p class="intro">'+intro+'</p>':'');
  let groups={};
  cat.cards.filter(card=>card.include!==false).forEach(card=>(groups[card.group]??=[]).push(card));
  Object.entries(groups).forEach(([g,arr])=>{
    if(g)sec.innerHTML+='<h3>'+esc(g)+'</h3>';
    arr.forEach(x=>{
      let card=document.createElement('article');
      card.className='card';
      card.dataset.mode=modeOf(x);
      card.dataset.cardId=x.id;
      card.dataset.categoryId=cat.id;
      let answer=document.createElement('script');
      answer.type='application/json';
      answer.dataset.answerTemplate='';
      answer.textContent=JSON.stringify(x.answer_items||x.answer_template);
      card.innerHTML=(x.prompt_zh?'<div class="prompt">'+esc(x.prompt_zh)+'</div>':'')+'<div class="row"><textarea placeholder="在这里默写英文……"></textarea><button class="icon check" title="确认">✓</button><button class="icon reset" title="重置">↻</button></div><div class="feedback"></div>';
      card.appendChild(answer);
      sec.appendChild(card);
    })
  });
  app.appendChild(sec)
});
function show(i){document.querySelectorAll('section').forEach((x,n)=>x.classList.toggle('active',n===i));document.querySelectorAll('nav button').forEach((x,n)=>x.classList.toggle('active',n===i));requestAnimationFrame(()=>document.querySelectorAll('section.active textarea').forEach(autoGrowTextarea));window.scrollTo({top:0,behavior:'smooth'})}
function score(){let a=[...document.querySelectorAll('.card')];document.getElementById('score').textContent=a.filter(x=>x.dataset.ok==='1').length+' / '+a.length+' 正确'}
const TIMER_KEY='ielts-writing-timer-v1',timerDisplay=document.getElementById('timerDisplay'),timerToggle=document.getElementById('timerToggle'),timerReset=document.getElementById('timerReset');
let timerState={elapsed:0,running:false,startedAt:0};
function loadTimer(){try{let saved=JSON.parse(localStorage.getItem(TIMER_KEY)||'null');if(saved&&Number.isFinite(saved.elapsed)){timerState.elapsed=Math.max(0,saved.elapsed);timerState.running=Boolean(saved.running);timerState.startedAt=Number.isFinite(saved.startedAt)?saved.startedAt:Date.now()}}catch(error){}}
function saveTimer(){try{localStorage.setItem(TIMER_KEY,JSON.stringify(timerState))}catch(error){}}
function currentElapsed(){return timerState.elapsed+(timerState.running?Math.max(0,Date.now()-timerState.startedAt):0)}
function formatElapsed(ms){let total=Math.floor(ms/1000),seconds=total%60,minutes=Math.floor(total/60)%60,hours=Math.floor(total/3600),two=n=>String(n).padStart(2,'0');return hours?hours+':'+two(minutes)+':'+two(seconds):two(minutes)+':'+two(seconds)}
function renderTimer(){timerDisplay.textContent=formatElapsed(currentElapsed());let label=timerState.running?'暂停计时':'开始计时';timerToggle.textContent=timerState.running?'Ⅱ':'▶';timerToggle.title=label;timerToggle.setAttribute('aria-label',label)}
function toggleTimer(){if(timerState.running){timerState.elapsed=currentElapsed();timerState.running=false;timerState.startedAt=0}else{timerState.running=true;timerState.startedAt=Date.now()}saveTimer();renderTimer()}
function resetTimer(){timerState={elapsed:0,running:false,startedAt:0};saveTimer();renderTimer()}
function autoGrowTextarea(t){t.style.height='auto';t.style.height=t.scrollHeight+'px';window.clearTimeout(t._autoGrowTimer);t._autoGrowTimer=window.setTimeout(()=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'},50)}
function focusNextTextarea(t){let fields=[...document.querySelectorAll('textarea')],i=fields.indexOf(t),next=fields[(i+1)%fields.length];next.focus();autoGrowTextarea(next)}
function resetCard(c){let t=c.querySelector('textarea'),f=c.querySelector('.feedback');t.value='';c.dataset.ok='';f.className='feedback';t.style.borderColor='';autoGrowTextarea(t);score()}
function checkCard(c){let t=c.querySelector('textarea'),f=c.querySelector('.feedback');let answer=readAnswer(c);let ok=pass(c,t.value);c.dataset.ok=ok?'1':'0';f.className='feedback '+(ok?'good':'bad');f.innerHTML=ok?'✓ 正确':wrongFeedback(t.value,answer,c.dataset.mode);t.style.borderColor=ok?'#55af77':'';autoGrowTextarea(t);score()}
document.addEventListener('click',e=>{let c=e.target.closest('.card');if(!c)return;if(e.target.classList.contains('reset')){resetCard(c);return}if(e.target.classList.contains('check'))checkCard(c)});
timerToggle.addEventListener('click',toggleTimer);
timerReset.addEventListener('click',resetTimer);
document.addEventListener('input',e=>{let t=e.target;if(t instanceof HTMLTextAreaElement)autoGrowTextarea(t)});
document.addEventListener('keydown',e=>{let t=e.target;if(!(t instanceof HTMLTextAreaElement))return;let c=t.closest('.card');if(!c)return;let longForm=c.dataset.categoryId==='task_2_essay'||c.dataset.categoryId==='report';if(e.key==='Enter'&&!e.shiftKey&&!longForm){e.preventDefault();checkCard(c)}if(e.key==='Tab'&&e.shiftKey){e.preventDefault();resetCard(c);t.focus()}if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();focusNextTextarea(t)}});
document.querySelectorAll('textarea').forEach(autoGrowTextarea);
window.addEventListener('resize',()=>document.querySelectorAll('textarea').forEach(autoGrowTextarea));
loadTimer();
renderTimer();
window.setInterval(renderTimer,250);
score();
</script>
