<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IELTS 写作模板默写</title>
<style>
:root{--bg:#f7f5f2;--paper:#fff;--ink:#27242a;--muted:#756f79;--line:#e6dfda;--violet:#5c4a82;--light:#eeeaf7;--good:#197447;--bad:#ad3344}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:9;background:#f7f5f2ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head{max-width:1120px;margin:auto;padding:15px 22px 11px;display:flex;justify-content:space-between;gap:16px;align-items:end}
h1{margin:0;font-size:21px}.sub,#score{font-size:12px;color:var(--muted)}
nav{max-width:1120px;margin:auto;padding:0 22px 12px;display:flex;gap:7px;overflow:auto}
nav button{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--muted);border-radius:99px;padding:7px 11px;cursor:pointer}
nav button.active{background:var(--violet);border-color:var(--violet);color:#fff}
main{max-width:960px;margin:auto;padding:28px 22px 64px}
section{display:none}section.active{display:block}
h2{margin:0 0 4px;font-size:25px}.intro{color:var(--muted);margin:0 0 24px}
h3{font-size:16px;border-bottom:1px solid var(--line);padding-bottom:8px;margin:30px 0 10px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:15px;margin:10px 0}
.prompt{font-weight:650;margin-bottom:9px}
.row{display:flex;gap:8px}
textarea{width:100%;min-height:46px;resize:vertical;border-radius:8px;border:1px solid #d8d0df;padding:10px;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
textarea:focus{outline:0;border-color:var(--violet);box-shadow:0 0 0 3px var(--light)}
.icon{flex:0 0 42px;height:42px;border:1px solid #d8d0df;background:#fff;border-radius:8px;font-size:17px;cursor:pointer}
.feedback{display:none;margin-top:9px;padding:9px 10px;border-radius:8px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
.good{display:block;background:#eaf8ef;color:var(--good);border:1px solid #c9ead5}
.bad{display:block;background:#fff0f2;color:var(--bad);border:1px solid #ffd3d9}
.answer{color:#5c525c;margin-top:5px}.reference{font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;background:#f8f7f5;border:1px solid #ede8e3;padding:9px 10px;border-radius:8px;margin-top:6px}
.slot{background:#111;color:#111;border-radius:3px;padding:0 5px;min-width:45px}
@media(max-width:600px){.head{display:block;padding:13px 15px}#score{margin-top:4px}nav{padding:0 15px 11px}main{padding:22px 15px}}
</style>
</head>

const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const modeOf=card=>card.validation_mode==='loose_for_figure_1'?'loose':card.validation_mode==='keyword_set'?'keyword_set':'strict';
function skeleton(s){return esc(s).replace(/\[\[free:([^\]]+)\]\]/g,'<span class="slot">$1</span>')}
function loose(s){return s.toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'')}
function literal(s,mode){return mode==='loose'?loose(s):s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function matcher(ans,mode){let out='',i=0,slots=0,re=/\[\[free:[^\]]+\]\]/g,m;while((m=re.exec(ans))){out+=literal(ans.slice(i,m.index),mode);out+=mode==='loose'?'.*?':'([\\s\\S]+?)';if(mode!=='loose')slots+=1;i=m.index+m[0].length}out+=literal(ans.slice(i),mode);return {re:new RegExp('^'+out+'$','i'),slots}}
function normKeyword(s){return s.toLowerCase().trim().replace(/\s+/g,' ')}
function keywordSetPass(items,value){const target=items.map(normKeyword);if(target.length===1&&target[0].includes(' '))return normKeyword(value)===target[0];const parts=normKeyword(value).split(' ').filter(Boolean);if(parts.length!==target.length)return false;const seen=new Map();for(const part of parts)seen.set(part,(seen.get(part)||0)+1);for(const item of target){const count=seen.get(item)||0;if(!count)return false;seen.set(item,count-1)}return true}
function pass(card,value){const answer=readAnswer(card);const mode=card.dataset.mode;if(mode==='keyword_set')return keywordSetPass(Array.isArray(answer)?answer:[answer],value);const normalized=mode==='loose'?loose(value):value.trim();const match=normalized.match(matcher(answer,mode).re);if(!match)return false;if(mode==='strict')return match.slice(1).every(x=>x.trim().length>0);return true}
function readAnswer(card){return JSON.parse(card.querySelector('[data-answer-template]').textContent)}

cats.forEach((cat,ci)=>{let b=document.createElement('button');b.textContent=cat.name;b.className=ci===0?'active':'';b.onclick=()=>show(ci);nav.appendChild(b);let sec=document.createElement('section');sec.id='s'+ci;sec.className=ci===0?'active':'';sec.innerHTML='<h2>'+esc(cat.name)+'</h2><p class="intro">'+(cat.id==='figure_1_sentence_patterns'?'只考句型行；例句和造句不纳入。':cat.id==='task_1_keywords'?'同一提示下的多个关键词填在一个框里，空格分隔，顺序不限。':'每句可单独确认。')+'</p>';let groups={};cat.cards.filter(card=>card.include!==false).forEach(card=>(groups[card.group]??=[]).push(card));Object.entries(groups).forEach(([g,arr])=>{sec.innerHTML+='<h3>'+esc(g)+'</h3>';arr.forEach(x=>{let card=document.createElement('article');card.className='card';card.dataset.mode=modeOf(x);card.dataset.cardId=x.id;let answer=document.createElement('script');answer.type='application/json';answer.dataset.answerTemplate='';answer.textContent=JSON.stringify(x.answer_items||x.answer_template);card.innerHTML='<div class="prompt">'+esc(x.prompt_zh)+'</div><div class="row"><textarea placeholder="在这里默写英文……"></textarea><button class="icon check" title="确认">✓</button><button class="icon reset" title="重置">↻</button></div><div class="feedback"></div>';card.appendChild(answer);sec.appendChild(card)})});app.appendChild(sec)});
function show(i){document.querySelectorAll('section').forEach((x,n)=>x.classList.toggle('active',n===i));document.querySelectorAll('nav button').forEach((x,n)=>x.classList.toggle('active',n===i));window.scrollTo({top:0,behavior:'smooth'})}
function score(){let a=[...document.querySelectorAll('.card')];document.getElementById('score').textContent=a.filter(x=>x.dataset.ok==='1').length+' / '+a.length+' 正确'}
function resetCard(c){let t=c.querySelector('textarea'),f=c.querySelector('.feedback');t.value='';c.dataset.ok='';f.className='feedback';t.style.borderColor='';score()}
function checkCard(c){let t=c.querySelector('textarea'),f=c.querySelector('.feedback');let answer=readAnswer(c);let ok=pass(c,t.value);c.dataset.ok=ok?'1':'0';f.className='feedback '+(ok?'good':'bad');f.innerHTML=ok?'✓ 正确':'需要调整。<div class="answer">参考结构：<div class="reference">'+skeleton(Array.isArray(answer)?answer.join(' '):answer)+'</div></div>';t.style.borderColor=ok?'#55af77':'#db7884';score()}
document.addEventListener('click',e=>{let c=e.target.closest('.card');if(!c)return;if(e.target.classList.contains('reset')){resetCard(c);return}if(e.target.classList.contains('check'))checkCard(c)});
document.addEventListener('keydown',e=>{let t=e.target;if(!(t instanceof HTMLTextAreaElement))return;let c=t.closest('.card');if(!c)return;if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();checkCard(c)}if(e.key==='Tab'){e.preventDefault();resetCard(c);t.focus()}});
score();
</script>
</body>
</html>
