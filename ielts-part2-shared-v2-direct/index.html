<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IELTS Part 2 · 共用段落整合版</title>
<style>
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#faf8f5;color:#6b645c}.loading{height:100%;display:grid;place-items:center;padding:24px;text-align:center;font-size:14px;line-height:1.7}
</style>
<script src="../ielts-part2-shared-v2/assets/pako.min.js?v=direct-1"></script>
<script>window.__IELTS_PAYLOAD__='';</script>
<script src="assets/payload-00.js?v=direct-1"></script>
<script src="assets/payload-01.js?v=direct-1"></script>
<script src="assets/payload-02-03.js?v=direct-1"></script>
<script src="assets/payload-04-05.js?v=direct-1"></script>
<script src="assets/payload-06-07.js?v=direct-1"></script>
</head>
<body><div class="loading">正在载入…</div>
<script>
(function(){
  try{
    if(!window.pako) throw new Error('解压组件未载入');
    var encoded=window.__IELTS_PAYLOAD__||'';
    if(encoded.length<60000) throw new Error('页面数据不完整');
    var binary=atob(encoded);
    var bytes=new Uint8Array(binary.length);
    for(var i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    var html=window.pako.ungzip(bytes,{to:'string'});
    if(html.indexOf('<title>IELTS Part 2')<0||html.length<200000) throw new Error('页面数据校验失败');
    window.__IELTS_PAYLOAD__='';
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="loading">页面载入失败。<br><small>'+String(error&&error.message||error)+'</small></div>';
  }
})();
</script>
</body>
</html>
