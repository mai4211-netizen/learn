<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Writing Review</title></head><body><script>(async()=>{try{const files=['part1.b64','part2.b64','part3.b64','part4.b64','part5.b64','part6.b64','part7.b64'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const bin=atob(parts.join('').replace(/\s/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const html=new TextDecoder('utf-8').decode(bytes).replace('</body>','<script src="topics.js?v=1"></script></body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<p style="font:14px -apple-system;padding:24px">页面加载失败，请刷新后重试。</p>';console.error(e)}})();</script></body></html>
