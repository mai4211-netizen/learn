<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Writing Review</title></head><body><script>(async()=>{try{const files=['part1.b64','part2.b64','part3.b64','part4.b64','part5.b64','part6.b64','part7.b64'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const bin=atob(parts.join('').replace(/\s/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));let html=new TextDecoder('utf-8').decode(bytes);const fixes=[[`<div class="sentence">In A, the proportion of users <span class="verb">was highest</span>, <span class="link">while</span> those in B <span class="verb">accounted for the lowest proportion</span>. The figure for C <span class="verb">maintained the middle position</span>.</div>`,`<div class="sentence">In A, the proportion of users <span class="verb">was highest</span> (X%), <span class="link">while</span> those in B <span class="verb">accounted for the lowest proportion</span> (Y%). The figure for C <span class="verb">maintained the middle position</span>, constituting Z%.</div>`],[`<div class="sentence">The percentage of A was X%, <span class="link">about twice the figure for</span> B, and more than seven times the level in C.</div>`,`<div class="sentence">The percentage of A <span class="verb">was</span> X%, <span class="link">about twice the figure for</span> B (Y%), and <span class="link">more than seven times the level in</span> C (Z%).</div>`],[`<div class="sentence">The proportion of A was <span class="link">higher than that of</span> B, but considerably lower than the figure for C.</div>`,`<div class="sentence">In A, the proportion of users <span class="verb">was higher than</span> that of B (X% and Y%, respectively), but considerably <span class="verb">lower than</span> the figure for C (Z%).</div>`],[`<div class="sentence">The <span class="link">highest percentage</span> of A was in B, while the figure for C <span class="verb">was much lower</span> and that for D <span class="verb">was lowest</span>.</div>`,`<div class="sentence">The <span class="link">highest percentage</span> of users <span class="verb">was</span> in A, <span class="link">at X%</span>, while the figure for B <span class="verb">was much lower</span>, <span class="link">at Y%</span> and that for C <span class="verb">was lowest</span>, <span class="link">at only Z%</span>.</div>`],[`<div class="sentence">A <span class="verb">accounted for the highest proportion</span>, at X%, <span class="link">followed by</span> B, with Y%. The figure for C <span class="verb">was lowest</span>.</div>`,`<div class="sentence">A <span class="verb">accounted for the highest proportion</span>, <span class="link">at X%</span>, <span class="link">followed by</span> B, <span class="link">with Y%</span>. The figure for C <span class="verb">was lowest</span>, <span class="link">at Z%</span>.</div>`],[`<div class="sentence">The proportion of A was X%, <span class="link">compared with</span> Y% for B and Z% for C.</div>`,`<div class="sentence">The proportion of users in A <span class="verb">was</span> X%, <span class="link">compared with</span> Y% for B and Z% for C.</div>`]];fixes.forEach(([a,b])=>{if(!html.includes(a))throw new Error('static pattern not found');html=html.replace(a,b)});html=html.replace('<button class="tab" data-tab="essay">大作文</button>','<button class="tab" data-tab="essay">大作文</button><button class="tab" data-tab="topics">话题观点</button>');html=html.replace('</head>','<style>section.panel:not(#essay) .section-label{font-size:22px!important;line-height:1.3!important;font-weight:780!important;color:var(--text)!important;text-transform:none!important;letter-spacing:0!important;margin:4px 0 16px!important}section.panel:not(#essay) .card>.section-label{font-size:24px!important;margin-top:2px!important}section.panel:not(#essay) h2,section.panel:not(#essay) h3{font-size:24px!important;line-height:1.3!important;font-weight:780!important}@media(max-width:640px){section.panel:not(#essay) .section-label{font-size:20px!important}section.panel:not(#essay) .card>.section-label{font-size:22px!important}}</style></head>');html=html.replace('<script>','<section id="topics" class="panel"><iframe src="topics.html?embed=1" title="话题观点" style="width:100%;height:calc(100vh - 220px);min-height:680px;border:0;background:transparent;display:block"></iframe></section><script>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<p style="font:14px -apple-system;padding:24px">页面加载失败，请刷新后重试。</p>';console.error(e)}})();</script></body></html>
