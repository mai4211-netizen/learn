<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>话题观点</title><style>:root{--bg:#f6f5f1;--panel:#fff;--text:#1f1f1c;--muted:#77746d;--line:#e5e1d8;--shadow:0 10px 30px rgba(25,25,20,.06);--radius:16px}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-size:14px;color:var(--muted);letter-spacing:.02em}.back{border:1px solid var(--line);background:#fff;color:#55514a;padding:8px 12px;border-radius:11px;text-decoration:none;font-size:13px;white-space:nowrap}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px}.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#55514a;padding:9px 14px;border-radius:12px;cursor:pointer;font-size:14px}.tab.active{background:#1f1f1c;color:#fff;border-color:#1f1f1c}.panel{display:none}.panel.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.callout{background:#fbfaf7;border:1px dashed #d8d2c6;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.6;margin-bottom:14px}.section-label{font-size:12px;color:var(--muted);margin:3px 0 10px;text-transform:uppercase;letter-spacing:.08em}</style></head><body><div class="wrap"><div class="topbar"><div class="brand">IELTS Writing · review</div><a class="back" href="./">← 返回复习</a></div><div class="tabs"></div></div><script src="topics.js?v=3"></script><script>const b=document.querySelector('[data-tab="topics"]');if(b)b.click();</script></body></html>
