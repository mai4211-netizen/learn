<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IELTS Part 2｜2026 Sep–Dec 爱听写 52题</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="eyebrow">2026 SEP–DEC · 爱听写题库</div>
      <h1>IELTS Part 2<br>故事母版重修版</h1>
      <div class="stats">
        <div class="stat"><b id="statTopics">52</b><span>题目</span></div>
        <div class="stat"><b id="statStories">11</b><span>故事母版</span></div>
        <div class="stat"><b id="statGroups">22</b><span>语料组</span></div>
      </div>
      <div class="backup-tools">
        <button id="exportBold" type="button">导出加粗</button>
        <button id="importBold" type="button">导入加粗</button>
        <input id="importBoldFile" type="file" accept="application/json,.json" hidden>
      </div>
      <div id="backupStatus" class="backup-status" aria-live="polite"></div>
    </div>
    <div class="search"><input id="search" placeholder="搜索题目，例如：自然 / Claire / Q16"></div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <article class="card" id="card">
      <header class="head">
        <div class="kicker"><span id="index"></span><span class="category" id="category"></span></div>
        <h2 id="title"></h2>
        <div class="story-line"><span id="story"></span></div>
        <div class="memory" id="memory"></div>
      </header>

      <div class="topic-wrap">
        <div class="topic-label">这个母版可以 cover：</div>
        <div class="topics" id="topics"></div>
        <div class="prompt" id="prompt"></div>
        <div class="chain" id="chain"></div>
      </div>

      <div class="answer-box">
        <div class="answer-head">
          <div>
            <b id="answerTitle"></b>
            <span class="legend">
              <i class="dot shared-dot"></i>母版共用
              <i class="dot own-dot"></i>本题专属
              <i class="dot adjusted-dot"></i>母版微调
            </span>
          </div>
          <div class="answer-tools">
            <div class="source-toggle">
              <button class="source-btn on" id="mineBoldSource" type="button">我的加粗</button>
              <button class="source-btn" id="recommendedBoldSource" type="button">推荐加粗</button>
            </div>
            <button class="filter-btn" id="boldOnlyToggle" type="button">只看加粗</button>
          </div>
        </div>
        <div class="answer" id="answer"></div>
      </div>
    </article>
    <div class="empty" id="empty">没有匹配的题目或母版。</div>
    <div class="foot">2026 Sep–Dec · 爱听写 52题 · 目标 6–6.5 · 旧故事优先 · 不硬套</div>
  </main>
</div>

<div class="selection-tools" id="selectionTools" hidden>
  <button id="boldToggle" type="button">加粗</button><span>Ctrl / ⌘ + B</span>
</div>

<script src="data.js"></script>
<script src="patch-ui-v2.js"></script>
<script src="patch-ui-v3.js"></script>
<script src="patch-ui-v4.js"></script>
<script src="patch-ui-v5.js"></script>
<script src="reviewed-a.js"></script>
<script src="reviewed-b1.js"></script>
<script src="reviewed-b2.js"></script>
<script src="reviewed-length.js"></script>
<script src="reviewed-smooth.js"></script>
<script src="reviewed-smooth2.js"></script>
<script src="reviewed-keywords2.js"></script>
<script src="reviewed-q22.js"></script>
<script src="reviewed-merge1.js"></script>
<script src="reviewed-merge2.js"></script>
<script src="reviewed-merge3.js"></script>
<script src="reviewed-simplelevel.js"></script>
<script src="reviewed-finalpolish.js"></script>
<script src="app.js"></script>
</body>
</html>
