<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IELTS Part 2｜相似内容共用版 v12</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="eyebrow">SHARED CONTENT · V12</div><h1>IELTS Part 2<br>相似内容共用版</h1><p>相似题放在同一个 tab，能共用的正文尽量共用；每题只保留必要的扣题角度。</p><div class="stats"><div class="stat"><b>59</b><span>题目</span></div><div class="stat"><b>22</b><span>相似语料组</span></div><div class="stat"><b>B</b><span>选择加粗</span></div></div></div>
  <div class="search"><input id="search" placeholder="搜索题号或题目，例如 Q01 / 妹妹"></div>
  <nav class="nav" id="nav"></nav>
</aside>
<main class="main">
  <article class="card" id="card">
    <header class="head"><div class="kicker"><span id="index"></span><span class="category" id="category"></span></div><h2 id="title"></h2><div class="memory" id="memory"></div></header>
    <div class="topic-wrap"><div class="topic-label">这个 tab 里的高相似题：</div><div class="topics" id="topics"></div><div class="prompt" id="prompt"></div></div>
    <div class="answer-box"><div class="answer-head"><b id="answerTitle"></b><button class="filter-btn" id="boldOnlyToggle" type="button">只看加粗</button></div><div class="answer" id="answer"></div></div>
  </article>
  <div class="empty" id="empty">没有匹配的相似组。</div>
  <div class="foot">v12 · 相似内容尽量共用 · 每题保留扣题角度 · 加粗自动保存在当前浏览器</div>
</main>
</div>
<div class="selection-tools" id="selectionTools" hidden><button id="boldToggle" type="button">加粗</button><span>Ctrl / ⌘ + B</span></div>
<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="data4.js"></script>
<script src="data5.js"></script>
<script src="patch-v5.js"></script>
<script src="patch-v6.js"></script>
<script src="patch-v7.js"></script>
<script src="patch-v10.js"></script>
<script src="patch-v11.js"></script>
<script src="patch-v12.js"></script>
<script src="groups-v12.js"></script>
<script src="app-v12.js"></script>
</body></html>
