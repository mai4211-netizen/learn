<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IELTS Part 2｜22 个完整答案预览版 v2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="eyebrow">GITHUB PREVIEW · MEMORY V4</div><h1>IELTS Part 2<br>完整答案合并版</h1><p>重点是少背几篇，而不是把每篇砍短。选择题目后，只切换少量适配句。</p><div class="stats"><div class="stat"><b>59</b><span>题目</span></div><div class="stat"><b>21</b><span>完整模板</span></div><div class="stat"><b>0</b><span>新增人物</span></div></div></div>
  <div class="search"><input id="search" placeholder="搜索题号或题目，例如 Q30 / 医疗"></div>
  <nav class="nav" id="nav"></nav>
</aside>
<main class="main">
  <div class="topbar"><p>蓝色是固定故事；橙色是该题需要换的少量句子。词数按原稿信息量恢复，不再统一压到 150。</p><button class="mode-btn" id="mode">模拟口述：关闭标记</button></div>
  <article class="card" id="card">
    <header class="head"><div class="kicker"><span id="index"></span><span class="category" id="category"></span></div><h2 id="title"></h2><div class="memory" id="memory"></div><div class="note" id="note"></div></header>
    <div class="topic-wrap"><div class="topic-label">这篇完整答案覆盖：</div><div class="topics" id="topics"></div><div class="prompt" id="prompt"></div></div>
    <div class="answer-box"><div class="answer-head"><b id="answerTitle"></b><div class="tools"><button class="tool" id="copy">复制答案</button><button class="tool" onclick="window.print()">打印</button></div></div><div class="answer" id="answer"></div></div>
    <div class="legend"><span class="dot shared">固定故事，所有题尽量原样说</span><span class="dot local">局部调整，通常只有开头和结尾</span></div>
  </article>
  <div class="empty" id="empty">没有匹配的模板。</div>
  <div class="foot">GitHub 预览 v4 · 中文记忆链版</div>
</main>
</div>
<script src="data1.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="data4.js"></script>
<script src="data5.js"></script>
<script src="app.js"></script>
</body></html>
