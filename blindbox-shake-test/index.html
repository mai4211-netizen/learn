<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#9b82ff" />
<title>盲盒摇摇乐 · Mobile Test</title>
<style>
:root{--bg1:#927bff;--bg2:#cdb6ff;--bg3:#e6ceff;--pink:#ffc4df;--pink2:#ff9dcc;--ink:#2a202d;--violet:#7750f3}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a58cff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{touch-action:manipulation;overscroll-behavior:none}.app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2) 58%,var(--bg3));isolation:isolate}.pattern{position:absolute;inset:-50px;opacity:.19;background-image:radial-gradient(circle at 24px 24px,transparent 0 11px,rgba(255,255,255,.6) 12px 14px,transparent 15px),radial-gradient(circle at 115px 90px,rgba(255,255,255,.55) 0 10px,transparent 12px);background-size:150px 150px;transform:rotate(-7deg);z-index:-3}.pattern:before,.pattern:after{content:"☆";position:absolute;color:#fff;font-size:56px;line-height:1;letter-spacing:108px;white-space:pre;word-spacing:80px;width:110vw;height:120vh;overflow:hidden}.pattern:before{left:0;top:10px}.pattern:after{left:60px;top:100px}.safe-top{position:absolute;left:18px;right:18px;top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;z-index:10}.badge{font-size:12px;font-weight:750;color:rgba(255,255,255,.9);padding:7px 10px;border-radius:999px;background:rgba(88,54,171,.16);backdrop-filter:blur(8px)}.meter{display:flex;align-items:center;gap:7px}.meter-track{width:74px;height:6px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}.meter-fill{height:100%;width:0%;border-radius:99px;background:white;transition:width .09s linear}.stage{position:absolute;inset:0;overflow:hidden}.box{position:absolute;width:min(45vw,205px);aspect-ratio:.73;left:50%;top:42%;transform:translate(-50%,-50%);will-change:transform,filter;filter:drop-shadow(0 18px 18px rgba(70,45,120,.16));transform-origin:50% 55%}.case{position:absolute;inset:0;border:4px solid rgba(255,216,232,.96);border-radius:17px;background:linear-gradient(145deg,rgba(255,225,238,.72),rgba(255,170,210,.68));box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),inset 0 0 0 7px rgba(255,143,196,.2),0 0 0 1px rgba(98,51,86,.28);overflow:hidden}.case:before{content:"";position:absolute;left:7px;right:7px;top:7px;height:18%;background:var(--ink);border-radius:10px 10px 7px 7px;box-shadow:0 calc(100% * 4.6) 0 var(--ink)}.case:after{content:"Bunny Baby  ·  BLIND BOX";position:absolute;left:11px;right:11px;bottom:10px;color:#fff;text-align:center;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:clamp(11px,3.2vw,15px);letter-spacing:.02em;z-index:3}.window{position:absolute;left:13%;right:13%;top:24%;bottom:19%;border:3px solid rgba(255,240,246,.84);border-radius:34px 34px 28px 28px;background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,180,213,.12));box-shadow:inset 0 0 28px rgba(255,255,255,.42)}.mystery{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);width:65%;aspect-ratio:.83;border-radius:48% 48% 42% 42%;background:radial-gradient(circle at 50% 40%,#ffd6e9 0 20%,#ffb9db 45%,#ff95ca 100%);box-shadow:0 0 30px rgba(255,233,249,.75);opacity:.9}.mystery:before{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:clamp(54px,17vw,82px);font-family:Georgia,serif;text-shadow:0 2px 0 rgba(185,100,145,.28)}.bow{position:absolute;left:50%;top:12%;width:76px;height:38px;transform:translateX(-50%);z-index:4}.bow:before,.bow:after{content:"";position:absolute;top:5px;width:34px;height:26px;background:linear-gradient(145deg,#ffd8e8,#ff9fc9);border:2px solid rgba(255,230,239,.8);box-shadow:0 1px 0 rgba(154,73,114,.3)}.bow:before{right:37px;border-radius:70% 24% 64% 38%;transform:rotate(12deg)}.bow:after{left:37px;border-radius:24% 70% 38% 64%;transform:rotate(-12deg)}.bow i{position:absolute;width:18px;height:18px;border-radius:5px;background:#ff9fc9;left:29px;top:9px;z-index:2;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}.heart{position:absolute;color:#ffbeda;font-size:14px;z-index:4}.h1{left:10%;top:31%}.h2{right:10%;top:38%}.h3{left:16%;bottom:22%}.h4{right:13%;bottom:26%}.impact{position:absolute;width:100px;height:100px;margin:-50px;border-radius:50%;opacity:0;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.98) 0 8%,rgba(255,227,250,.72) 18%,rgba(199,145,255,.28) 42%,transparent 70%);z-index:2}.shock{position:absolute;width:86px;height:86px;margin:-43px;border:3px solid rgba(255,255,255,.82);border-radius:50%;opacity:0;pointer-events:none;z-index:2}.controls{position:absolute;left:50%;bottom:max(32px,calc(env(safe-area-inset-bottom) + 22px));transform:translateX(-50%);width:min(82vw,380px);text-align:center;z-index:12;transition:opacity .2s}.start{width:100%;border:0;border-radius:999px;padding:15px 20px 16px;font-size:19px;font-weight:850;color:#fff;letter-spacing:.02em;background:linear-gradient(180deg,#b09cff,#8158ff 54%,#744af4);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(80,34,194,.26),0 0 0 4px rgba(132,83,255,.28),0 13px 32px rgba(84,48,177,.22)}.hint{margin-top:12px;color:rgba(255,255,255,.88);font-size:12px;font-weight:650;text-shadow:0 1px 4px rgba(72,44,126,.25)}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25}.result{position:absolute;inset:0;display:none;opacity:0;z-index:30;background:linear-gradient(180deg,#937cff,#c6abff 62%,#dcc6ff);overflow:hidden}.result:before{content:"";position:absolute;inset:-30px;opacity:.18;background-image:radial-gradient(circle at 30px 30px,rgba(255,255,255,.8) 0 10px,transparent 11px);background-size:145px 145px}.result-content{position:absolute;inset:max(65px,calc(env(safe-area-inset-top) + 38px)) 7vw max(28px,calc(env(safe-area-inset-bottom) + 18px));display:flex;flex-direction:column;align-items:center}.result-box{position:relative;width:min(49vw,220px);aspect-ratio:.73;margin-top:8vh;filter:drop-shadow(0 15px 20px rgba(73,43,134,.18))}.result-box .case{border-width:3px}.character{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:64%;aspect-ratio:.82;border-radius:50% 50% 43% 43%;background:radial-gradient(circle at 50% 36%,#fff1dc 0 17%,#29252b 19% 49%,#ffbdd8 51% 67%,#27242b 69% 100%);box-shadow:0 0 20px rgba(255,255,255,.45);z-index:3}.character:before{content:"• ᴗ •";position:absolute;left:0;right:0;top:31%;text-align:center;color:#f57094;font-size:16px;font-weight:800}.title{margin:5.2vh 0 2.2vh;color:white;font-size:clamp(23px,6vw,31px);font-weight:900;text-shadow:0 2px 10px rgba(99,61,183,.22)}.rewards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px 10px;width:min(84vw,390px)}.reward{aspect-ratio:1.08;border-radius:13px;background:rgba(255,255,255,.94);position:relative;box-shadow:inset 0 0 18px rgba(187,143,255,.16)}.reward:before{content:"✿";position:absolute;inset:0;display:grid;place-items:center;color:#d9baff;font-size:32px;text-shadow:12px 0 #ffd5e8,-12px 0 #b9ddff}.reward:nth-child(-n+3):after{content:"功能";position:absolute;right:-2px;top:-4px;padding:3px 9px;border-radius:99px;background:#9174ff;color:#fff;font-size:11px;font-weight:750}.reward span{position:absolute;right:0;bottom:0;padding:3px 8px;border-radius:9px 0 11px 0;background:#8d819e;color:white;font-size:11px}.again{margin-top:auto;width:min(82vw,370px);border:0;border-radius:999px;padding:14px 20px;color:#fff;font-size:20px;font-weight:850;background:linear-gradient(180deg,#a795ff,#7a51f7);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 0 0 4px rgba(132,83,255,.27)}.small{margin-top:5px;font-size:12px;color:rgba(255,255,255,.78)}@media(min-width:700px){.app{max-width:430px;left:50%;right:auto;transform:translateX(-50%);box-shadow:0 0 50px rgba(0,0,0,.18)}}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="pattern"></div>
  <div class="safe-top"><div class="badge" id="status">准备摇盒</div><div class="badge meter"><span id="powerText">0%</span><span class="meter-track"><i class="meter-fill" id="power"></i></span></div></div>
  <div class="stage" id="stage">
    <div class="impact" id="impact"></div><div class="shock" id="shock"></div>
    <div class="box" id="box" aria-label="盲盒">
      <div class="case"><div class="window"><div class="mystery"></div></div><div class="bow"><i></i></div><b class="heart h1">♥</b><b class="heart h2">♥</b><b class="heart h3">♥</b><b class="heart h4">♥</b></div>
    </div>
  </div>
  <div class="controls" id="controls"><button class="start" id="start">开始摇盒</button><div class="hint">点击直接测试；允许动作权限后，也可快速摇动手机触发</div></div>
  <div class="flash" id="flash"></div>
  <section class="result" id="result">
    <div class="result-content">
      <div class="result-box"><div class="case"><div class="window"></div><div class="bow"><i></i></div><div class="character"></div></div></div>
      <div class="title">盲盒名称盲盒名称</div>
      <div class="rewards"><div class="reward"><span>永久</span></div><div class="reward"><span>永久</span></div><div class="reward"><span>永久</span></div><div class="reward"><span>1天</span></div><div class="reward"><span>1天</span></div><div class="reward"><span>1天</span></div><div class="reward"><span>1天</span></div><div class="reward"><span>1天</span></div></div>
      <button class="again" id="again">再抽一次</button><div class="small">测试页 · iOS Safari 仅提供视觉强弱反馈</div>
    </div>
  </section>
</main>
<script>
(()=>{
const app=document.getElementById('app'),box=document.getElementById('box'),stage=document.getElementById('stage'),impact=document.getElementById('impact'),shock=document.getElementById('shock'),flash=document.getElementById('flash'),controls=document.getElementById('controls'),startBtn=document.getElementById('start'),status=document.getElementById('status'),power=document.getElementById('power'),powerText=document.getElementById('powerText'),result=document.getElementById('result'),again=document.getElementById('again');
let running=false,motionReady=false,lastMotion={x:0,y:0,z:0},lastShake=0,pos={x:0,y:0,r:0};
const sleep=m=>new Promise(r=>setTimeout(r,m)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),randi=(a,b)=>Math.floor(rand(a,b+1));
function setBox(x,y,r=0,s=1){box.style.left='0';box.style.top='0';box.style.transform=`translate3d(${x}px,${y}px,0) rotate(${r}deg) scale(${s})`;pos={x,y,r}}
function centerPos(){const a=app.getBoundingClientRect(),b=box.getBoundingClientRect();return{x:a.width/2-b.width/2,y:a.height*.42-b.height/2}}
function bounds(){const a=app.getBoundingClientRect(),b=box.getBoundingClientRect(),m=7;return{w:a.width,h:a.height,bw:b.width,bh:b.height,l:m,r:a.width-b.width-m,t:Math.max(48,m),bt:a.height-b.height-Math.max(92,m)}}
function meter(s){const n=Math.round(s*100);power.style.width=n+'%';powerText.textContent=n+'%'}
function vib(s,final=false){if(!navigator.vibrate)return;if(final){navigator.vibrate([65,25,105]);return}navigator.vibrate(Math.round(mix(12,58,s)))}
function hitFX(s,final=false){const r=box.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;impact.style.left=x+'px';impact.style.top=y+'px';shock.style.left=x+'px';shock.style.top=y+'px';impact.getAnimations().forEach(a=>a.cancel());shock.getAnimations().forEach(a=>a.cancel());impact.animate([{opacity:0,transform:'scale(.3)'},{opacity:.95,transform:`scale(${mix(.75,1.5,s)})`,offset:.25},{opacity:0,transform:`scale(${mix(1.25,2.35,s)})`}],{duration:final?430:220+s*150,easing:'cubic-bezier(.15,.8,.2,1)'});shock.animate([{opacity:0,transform:'scale(.35)'},{opacity:.8,transform:`scale(${mix(.7,1.15,s)})`,offset:.2},{opacity:0,transform:`scale(${mix(1.1,2.25,s)})`}],{duration:final?480:250+s*170,easing:'ease-out'});stage.animate([{transform:'translate(0,0)'},{transform:`translate(${-3-7*s}px,${2+3*s}px)`,offset:.22},{transform:`translate(${3+6*s}px,${-2-3*s}px)`,offset:.48},{transform:`translate(${-2-3*s}px,1px)`,offset:.72},{transform:'translate(0,0)'}],{duration:150+s*95,easing:'ease-out'})}
function target(prev){const b=bounds(),edge=randi(0,3);let x,y;if(edge===0){x=b.l;y=rand(b.t,b.bt)}else if(edge===1){x=b.r;y=rand(b.t,b.bt)}else if(edge===2){x=rand(b.l,b.r);y=b.t}else{x=rand(b.l,b.r);y=b.bt}const diag=Math.hypot(b.w,b.h),d=Math.hypot(x-prev.x,y-prev.y);if(d<diag*.28){if(edge===0)x=b.r;else if(edge===1)x=b.l;else if(edge===2)y=b.bt;else y=b.t}return{x,y}}
async function moveTo(t,i,total){const b=bounds(),diag=Math.hypot(b.w,b.h),d=Math.hypot(t.x-pos.x,t.y-pos.y),s=clamp((d-diag*.12)/(diag*.68),.15,1),dur=Math.round(mix(250,500,clamp(d/diag,0,1))),rr=pos.r+rand(-18,18)+(Math.random()>.5?1:-1)*s*7;meter(s);status.textContent=`撞击 ${i}/${total} · ${s>.72?'重':s>.42?'中':'轻'}`;const a=box.animate([{transform:`translate3d(${pos.x}px,${pos.y}px,0) rotate(${pos.r}deg) scale(1)`},{transform:`translate3d(${mix(pos.x,t.x,.78)}px,${mix(pos.y,t.y,.78)}px,0) rotate(${mix(pos.r,rr,.82)}deg) scale(${1+s*.035})`,offset:.82},{transform:`translate3d(${t.x}px,${t.y}px,0) rotate(${rr}deg) scale(${1-s*.055})`}],{duration:dur,easing:'cubic-bezier(.24,.78,.16,1)',fill:'forwards'});await a.finished;pos={x:t.x,y:t.y,r:rr};setBox(pos.x,pos.y,pos.r);hitFX(s);vib(s);const rx=clamp(pos.x+(pos.x<b.w/2?1:-1)*rand(10,23),b.l,b.r),ry=clamp(pos.y+(pos.y<b.h/2?1:-1)*rand(8,19),b.t,b.bt),rb=box.animate([{transform:`translate3d(${pos.x}px,${pos.y}px,0) rotate(${pos.r}deg) scale(${1-s*.055})`},{transform:`translate3d(${rx}px,${ry}px,0) rotate(${pos.r*.94}deg) scale(1.018)`},{transform:`translate3d(${rx}px,${ry}px,0) rotate(${pos.r*.94}deg) scale(1)`}],{duration:150+s*70,easing:'cubic-bezier(.2,.75,.2,1)',fill:'forwards'});await rb.finished;pos={x:rx,y:ry,r:pos.r*.94};setBox(pos.x,pos.y,pos.r);await sleep(rand(45,100))}
async function reveal(){status.textContent='开奖 · MAX';meter(1);const c=centerPos(),a=box.animate([{transform:`translate3d(${pos.x}px,${pos.y}px,0) rotate(${pos.r}deg) scale(1)`},{transform:`translate3d(${c.x}px,${c.y}px,0) rotate(0deg) scale(1.18)`,offset:.72},{transform:`translate3d(${c.x}px,${c.y}px,0) rotate(0deg) scale(.92)`}],{duration:470,easing:'cubic-bezier(.18,.82,.18,1)',fill:'forwards'});await a.finished;pos={x:c.x,y:c.y,r:0};setBox(c.x,c.y,0,.92);hitFX(1,true);vib(1,true);flash.animate([{opacity:0},{opacity:.96,offset:.23},{opacity:.2,offset:.55},{opacity:0}],{duration:450,easing:'ease-out',fill:'forwards'});await sleep(110);result.style.display='block';result.animate([{opacity:0,transform:'scale(.965)'},{opacity:1,transform:'scale(1)'}],{duration:360,easing:'cubic-bezier(.2,.85,.2,1)',fill:'forwards'});await sleep(360);result.style.opacity='1';running=false}
async function run(){if(running)return;running=true;result.style.display='none';result.style.opacity='0';controls.style.opacity='0';controls.style.pointerEvents='none';const c=centerPos();setBox(c.x,c.y,0);status.textContent='摇盒中';meter(0);const n=randi(2,5);for(let i=1;i<=n;i++)await moveTo(target(pos),i,n);await reveal()}
async function enableMotion(){if(motionReady)return;try{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){const p=await DeviceMotionEvent.requestPermission();if(p!=='granted')return}window.addEventListener('devicemotion',e=>{if(running)return;const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;const x=a.x||0,y=a.y||0,z=a.z||0,d=Math.abs(x-lastMotion.x)+Math.abs(y-lastMotion.y)+Math.abs(z-lastMotion.z),now=Date.now();lastMotion={x,y,z};if(d>18&&now-lastShake>1100){lastShake=now;run()}},{passive:true});motionReady=true}catch(e){}}
startBtn.addEventListener('click',async()=>{await enableMotion();run()});again.addEventListener('click',()=>{if(running)return;result.style.display='none';result.style.opacity='0';controls.style.opacity='1';controls.style.pointerEvents='auto';status.textContent='准备摇盒';meter(0);const c=centerPos();setBox(c.x,c.y,0)});window.addEventListener('resize',()=>{if(!running&&result.style.display!=='block'){const c=centerPos();setBox(c.x,c.y,0)}});requestAnimationFrame(()=>{const c=centerPos();setBox(c.x,c.y,0)});
})();
</script>
</body>
</html>
