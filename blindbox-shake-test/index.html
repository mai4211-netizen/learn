    .topbar {
      position: absolute;
      z-index: 50;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .topbar > * { pointer-events: auto; }

    .app.result-mode .status {
      opacity: 0;
      pointer-events: none;
    }

    .app.result-mode .back {
      color: #1c1530;
      background: rgba(255,255,255,.12);
      box-shadow: none;
    }

    .back {
      min-width: 56px;
      height: 36px;
      border: 0;
      border-radius: 18px;
      color: rgba(255,255,255,.96);
      background: var(--glass);
      box-shadow: 0 6px 18px rgba(74, 43, 138, .12);
      font-size: 14px;
      font-weight: 750;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 11px;
      border-radius: 18px;
      background: var(--glass);
      box-shadow: 0 6px 18px rgba(74, 43, 138, .12);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .01em;
    }

    .dots { display: flex; gap: 4px; }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,.28);
      transform: scale(.9);
      transition: background .15s ease, transform .15s ease;
    }
    .dot.on { background: #fff; transform: scale(1.08); }

    .shake-screen, .result-screen {
      position: absolute;
      inset: 0;
    }

    .shake-screen { z-index: 2; }

    .arena {
      position: absolute;
      inset: max(64px, calc(env(safe-area-inset-top) + 48px)) 0 max(132px, calc(env(safe-area-inset-bottom) + 120px));
      overflow: hidden;
    }

    .moving-box {
      position: absolute;
      left: 0;
      top: 0;
      width: clamp(146px, 46vw, 214px);
      aspect-ratio: 450 / 666;
      will-change: transform, filter;
      transform-origin: 50% 54%;
      filter: drop-shadow(0 18px 18px rgba(61, 39, 109, .22));
      touch-action: none;
      cursor: grab;
    }

    .moving-box.dragging { cursor: grabbing; }

    .moving-box img,
    .result-box {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .result-box {
      transform: scale(1.18);
      transform-origin: 50% 0;
    }

    .impact-flash {
      position: absolute;
      inset: 0;
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      background: #fff;
    }

    .impact-flash.pulse { animation: impact-flash .22s ease-out; }
    .impact-flash.final { animation: final-flash .48s ease-out; }

    @keyframes impact-flash {
      0%, 100% { opacity: 0; }
      24% { opacity: var(--flash-strength, .18); }
    }

    @keyframes final-flash {
      0%, 100% { opacity: 0; }
      30% { opacity: .88; }
      58% { opacity: .2; }
    }

    .instructions {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 18px));
      width: min(82vw, 380px);
      transform: translateX(-50%);
      text-align: center;
    }

    .primary {
      width: 100%;
      min-height: 58px;
      border: 1px solid rgba(255,255,255,.36);
      border-radius: 999px;
      color: #fff;
      background: var(--purple);
      box-shadow:
        inset 0 3px 0 rgba(255,255,255,.34),
        inset 0 -4px 0 rgba(71,35,180,.22),
        0 0 0 5px rgba(126,75,246,.24),
        0 13px 30px rgba(73,42,158,.22);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .02em;
    }

    .primary:active { transform: scale(.985); }
    .primary[disabled] { opacity: .72; }

    .hint {
      min-height: 34px;
      margin: 13px auto 0;
      padding: 0 8px;
      color: rgba(255,255,255,.94);
      text-shadow: 0 2px 7px rgba(66,37,126,.3);
      font-size: 12px;
      font-weight: 720;
      line-height: 1.45;
    }

    .result-screen {
      z-index: 30;
      display: none;
      opacity: 0;
      overflow: hidden;
      background: transparent;
    }

    .result-screen.show {
      display: block;
      animation: result-in .38s cubic-bezier(.2,.84,.2,1) forwards;
    }

    @keyframes result-in {
      from { opacity: 0; transform: scale(.975); }
      to { opacity: 1; transform: scale(1); }
    }

    .result-content {
      position: absolute;
      inset: max(62px, calc(env(safe-area-inset-top) + 48px)) 0 max(94px, calc(env(safe-area-inset-bottom) + 60px));
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(56px, 10vh, 84px) 18px 0;
    }

    .result-hero {
      width: clamp(176px, 49vw, 220px);
      aspect-ratio: 450 / 666;
      flex: 0 0 auto;
      filter: drop-shadow(0 18px 17px rgba(66, 39, 123, .2));
      animation: prize-pop .62s cubic-bezier(.14,.86,.22,1.22) both;
    }

    @keyframes prize-pop {
      0% { opacity: 0; transform: translateY(20px) scale(.72) rotate(-3deg); }
      72% { opacity: 1; transform: translateY(-4px) scale(1.04) rotate(1deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    .result-title {
      margin: clamp(32px, 5.8vh, 50px) 0 clamp(14px, 2.1vh, 22px);
      color: #fff;
      text-align: center;
      text-shadow: 0 2px 10px rgba(86, 51, 156, .23);
      font-size: clamp(24px, 6.2vw, 34px);
      font-weight: 900;
      line-height: 1.12;
      white-space: nowrap;
    }

    .rewards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px 10px;
      width: min(75vw, 340px);
    }

    .reward {
      position: relative;
      aspect-ratio: 1.06;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 12px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 8px 16px rgba(90,58,155,.08);
    }

    .reward img {
      display: block;
      width: 88%;
      height: 88%;
      margin: 5% auto 0;
      object-fit: contain;
    }

    .reward-badge {
      position: absolute;
      top: -1px;
      right: -1px;
      min-width: 48px;
      padding: 4px 9px 5px;
      border-radius: 0 12px 0 12px;
      background: #9174ff;
      color: #fff;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
    }

    .reward-time {
      position: absolute;
      right: -1px;
      bottom: -1px;
      padding: 3px 8px 4px;
      border-radius: 9px 0 11px 0;
      background: #8e829e;
      color: #fff;
      font-size: 11px;
      line-height: 1;
    }

    .again-wrap {
      width: min(74vw, 340px);
      margin-top: auto;
    }

    .again-wrap .primary {
      display: flex;
      min-height: 60px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      padding: 5px 20px 6px;
    }

    .coin-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      margin-top: 0;
      color: rgba(255,255,255,.92);
      font-size: 15px;
      font-weight: 650;
    }

    .coin {
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      color: #fff;
      background: #ffbd18;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.66);
      font-size: 11px;
      font-weight: 900;
    }

    .toast {
      position: absolute;
      z-index: 60;
      left: 50%;
      bottom: max(108px, calc(env(safe-area-inset-bottom) + 96px));
      width: max-content;
      max-width: 84vw;
      padding: 10px 14px;
      border-radius: 12px;
      color: #fff;
      background: rgba(43, 24, 82, .78);
      box-shadow: 0 10px 30px rgba(44,24,89,.2);
      opacity: 0;
      transform: translate(-50%, 8px);
      pointer-events: none;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-height: 720px) {
      .result-content { padding-top: 1vh; }
      .result-hero { width: clamp(150px, 42vw, 186px); }
      .result-title { margin: 12px 0 10px; font-size: 23px; }
      .rewards { width: min(72vw, 300px); gap: 6px 7px; }
      .primary { min-height: 52px; font-size: 18px; }
    }

    @media (min-width: 700px) {
      .app { box-shadow: 0 0 50px rgba(0,0,0,.18); }
    }

    @media (prefers-reduced-motion: reduce) {
      .result-screen.show, .result-hero { animation-duration: .01ms; }
    }
  </style>
</head>

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2100);
      }

      function boxSize() {
        return { width: movingBox.offsetWidth, height: movingBox.offsetHeight };
      }

      function arenaSize() {
        return { width: arena.clientWidth, height: arena.clientHeight };
      }

      function centerBox() {
        const area = arenaSize();
        const box = boxSize();
        body.x = (area.width - box.width) / 2;
        body.y = (area.height - box.height) / 2;
        body.vx = 0;
        body.vy = 0;
        rotation = 0;
        paintBox();
      }

      function paintBox(scale = 1) {
        movingBox.style.transform = `translate3d(${body.x}px, ${body.y}px, 0) rotate(${rotation}deg) scale(${scale})`;
      }

      function renderDots() {
        dots.innerHTML = Array.from({ length: targetHits }, (_, index) =>
          `<i class="dot ${index < hitCount ? 'on' : ''}"></i>`
        ).join('');
      }

      function setStatus(text) {
        statusText.textContent = text;
      }

      function ensureAudio() {
        if (audioContext) {
          if (audioContext.state === 'suspended') audioContext.resume();
          return;
        }
        const Context = window.AudioContext || window.webkitAudioContext;
        if (Context) audioContext = new Context();
      }

      function playImpactSound(strength, final = false) {
        if (!audioContext) return;
        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(final ? 88 : 116 - strength * 42, now);
        oscillator.frequency.exponentialRampToValueAtTime(final ? 42 : 58, now + (final ? .22 : .1));
        gain.gain.setValueAtTime(.0001, now);
        gain.gain.exponentialRampToValueAtTime(final ? .34 : .06 + strength * .17, now + .008);
        gain.gain.exponentialRampToValueAtTime(.0001, now + (final ? .25 : .12));
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(now);
        oscillator.stop(now + (final ? .27 : .14));
      }

      function haptic(strength, final = false) {
        playImpactSound(strength, final);
        if (!hasVibration) return;
        if (final) {
          navigator.vibrate([80, 25, 130, 28, 190]);
          return;
        }
        if (strength > .72) {
          navigator.vibrate([38, 12, 54]);
          return;
        }
        navigator.vibrate(Math.round(12 + strength * 48));
      }

      function pulseImpact(strength, final = false) {
        flash.classList.remove('pulse', 'final');
        void flash.offsetWidth;
        flash.style.setProperty('--flash-strength', (.08 + strength * .23).toFixed(2));
        flash.classList.add(final ? 'final' : 'pulse');

        const shake = 2 + strength * 8;
        app.animate([
          { transform: 'translate3d(0,0,0)' },
          { transform: `translate3d(${-shake}px,${shake * .5}px,0)`, offset: .24 },
          { transform: `translate3d(${shake * .75}px,${-shake * .45}px,0)`, offset: .52 },
          { transform: `translate3d(${-shake * .35}px,${shake * .2}px,0)`, offset: .76 },
          { transform: 'translate3d(0,0,0)' }
        ], { duration: final ? 330 : 140 + strength * 90, easing: 'ease-out' });
      }

      function prepareRound() {
        targetHits = randomInt(2, 5);
        hitCount = 0;
        distanceSinceImpact = 0;
        lastImpactTime = 0;
        wallContact = { left: false, right: false, top: false, bottom: false };
        renderDots();
      }

      function beginSettle() {
        prepareRound();
        state = 'settling';
        setStatus(`自然落底 · 0/${targetHits}`);
        startButton.disabled = true;
        startButton.textContent = '盲盒落下中…';
        hint.textContent = '先让盲盒在重力下落底，记为第 1 次撞击';
        lastFrameTime = performance.now();
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(tick);
      }

      function beginRun() {
        if (state === 'running' || state === 'revealing') return;
        if (!targetHits) prepareRound();
        state = 'running';
        setStatus(`摇动中 · ${hitCount}/${targetHits}`);
        startButton.disabled = true;
        startButton.textContent = '继续摇动手机';
        hint.textContent = '继续摇动；只有真正撞到边缘才会计数';
        lastFrameTime = performance.now();
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(tick);
      }

      function registerImpact(speedBeforeImpact) {
        const now = performance.now();
        const settling = state === 'settling';
        if (now - lastImpactTime < 170 || (!settling && state !== 'running')) return;
        if (speedBeforeImpact < 135 || distanceSinceImpact < 24) return;
        lastImpactTime = now;

        const area = arenaSize();
        const box = boxSize();
        const availableTravel = Math.max(1, area.width - box.width, area.height - box.height);
        const travelStrength = clamp(distanceSinceImpact / availableTravel, .1, 1);
        const speedStrength = clamp((speedBeforeImpact - 120) / 1380, .1, 1);
        const strength = clamp(travelStrength * .82 + speedStrength * .18, .12, .96);
        distanceSinceImpact = 0;
        hitCount += 1;
        renderDots();
        setStatus(`撞击 ${hitCount}/${targetHits} · ${strength > .72 ? '强' : strength > .42 ? '中' : '轻'}`);
        haptic(strength);
        pulseImpact(strength);

        if (settling) {
          state = 'armed';
          body.vx = 0;
          body.vy = 0;
          sensorForce = { x: 0, y: 0 };
          setStatus(`已落底 · 1/${targetHits}`);
          startButton.disabled = false;
          startButton.textContent = '现在开始摇';
          hint.textContent = '落底已算第 1 次；下一次必须摇到边缘才触发';
          return;
        }

        if (hitCount >= targetHits) {
          state = 'revealing';
          cancelAnimationFrame(animationFrame);
          setTimeout(revealResult, 180);
          return;
        }
      }

      function tick(time) {
        if (state !== 'running' && state !== 'settling') return;
        const settling = state === 'settling';
        const dt = clamp((time - lastFrameTime) / 1000, .008, .032);
        lastFrameTime = time;
        const area = arenaSize();
        const box = boxSize();
        const maxX = Math.max(0, area.width - box.width);
        const maxY = Math.max(0, area.height - box.height);

        if (pointer.active && !settling) {
          animationFrame = requestAnimationFrame(tick);
          return;
        }

        const sensorAge = performance.now() - lastMotionTime;
        const sensorFade = settling ? 0 : clamp(1 - Math.max(0, sensorAge - 35) / MOTION.sensorTimeout, 0, 1);
        const forceX = settling ? 0 : sensorForce.x * sensorFade;
        const forceY = settling ? MOTION.settleAcceleration / MOTION.pixelsPerMeter : sensorForce.y * sensorFade;
        const inputStrength = Math.hypot(forceX, forceY);

        // The box is loose inside the moving phone: its relative acceleration is
        // opposite to the phone, then friction settles it when the hand stops.
        body.vx += forceX * MOTION.pixelsPerMeter * dt;
        body.vy += forceY * MOTION.pixelsPerMeter * dt;

        const damping = Math.exp(-(inputStrength > .22 ? MOTION.activeDamping : MOTION.idleDamping) * dt);
        body.vx *= damping;
        body.vy *= damping;
        const speed = Math.hypot(body.vx, body.vy);
        if (speed > MOTION.maxSpeed) {
          const speedScale = MOTION.maxSpeed / speed;
          body.vx *= speedScale;
          body.vy *= speedScale;
        } else if (sensorFade === 0 && speed < 14) {
          body.vx = 0;
          body.vy = 0;
        }
        const oldX = body.x;
        const oldY = body.y;

        body.x += body.vx * dt;
        body.y += body.vy * dt;
        distanceSinceImpact += Math.hypot(body.x - oldX, body.y - oldY);

        let collided = false;
        let impactSpeed = 0;
        let newWallContact = false;
        if (body.x > MOTION.wallRelease) wallContact.left = false;
        if (body.x < maxX - MOTION.wallRelease) wallContact.right = false;
        if (body.y > MOTION.wallRelease) wallContact.top = false;
        if (body.y < maxY - MOTION.wallRelease) wallContact.bottom = false;

        if (body.x < 0 && body.vx < 0) {
          impactSpeed = Math.max(impactSpeed, -body.vx);
          body.x = 0;
          body.vx = wallContact.left ? 0 : Math.abs(body.vx) * MOTION.restitution;
          newWallContact = newWallContact || !wallContact.left;
          wallContact.left = true;
          collided = true;
        } else if (body.x > maxX && body.vx > 0) {
          impactSpeed = Math.max(impactSpeed, body.vx);
          body.x = maxX;
          body.vx = wallContact.right ? 0 : -Math.abs(body.vx) * MOTION.restitution;
          newWallContact = newWallContact || !wallContact.right;
          wallContact.right = true;
          collided = true;
        }
        if (body.y < 0 && body.vy < 0) {
          impactSpeed = Math.max(impactSpeed, -body.vy);
          body.y = 0;
          body.vy = wallContact.top ? 0 : Math.abs(body.vy) * MOTION.restitution;
          newWallContact = newWallContact || !wallContact.top;
          wallContact.top = true;
          collided = true;
        } else if (body.y > maxY && body.vy > 0) {
          impactSpeed = Math.max(impactSpeed, body.vy);
          body.y = maxY;
          body.vy = wallContact.bottom ? 0 : -Math.abs(body.vy) * MOTION.restitution;
          newWallContact = newWallContact || !wallContact.bottom;
          wallContact.bottom = true;
          collided = true;
        }

        const targetRotation = clamp(body.vx * .006 + forceX * .55, -12, 12);
        rotation += (targetRotation - rotation) * clamp(dt * 18, 0, 1);
        paintBox(collided ? .965 : 1);
        if (collided && newWallContact) registerImpact(impactSpeed);

        if (state === 'running' || state === 'settling') animationFrame = requestAnimationFrame(tick);
      }

      function revealResult() {
        haptic(1, true);
        pulseImpact(1, true);
        setStatus('开奖 · 最强');
        movingBox.animate([
          { transform: movingBox.style.transform },
          { transform: `translate3d(${body.x}px,${body.y}px,0) rotate(0deg) scale(1.14)`, offset: .55 },
          { transform: `translate3d(${body.x}px,${body.y}px,0) rotate(0deg) scale(.9)` }
        ], { duration: 420, easing: 'cubic-bezier(.16,.84,.2,1)' });

        setTimeout(() => {
          shakeScreen.hidden = true;
          app.classList.add('result-mode');
          resultScreen.classList.add('show');
          resultScreen.style.display = 'block';
          state = 'result';
          startButton.disabled = false;
        }, 165);
      }

      function normalizeMotion(event) {
        const raw = event.acceleration;
        if (raw && [raw.x, raw.y, raw.z].some(Number.isFinite)) {
          return { x: raw.x || 0, y: raw.y || 0, z: raw.z || 0 };
        }

        const withGravity = event.accelerationIncludingGravity;
        if (!withGravity) return null;
        if (!gravityReady) {
          gravity = { x: withGravity.x || 0, y: withGravity.y || 0, z: withGravity.z || 0 };
          gravityReady = true;
          return { x: 0, y: 0, z: 0 };
        }
        const alpha = .94;
        gravity.x = alpha * gravity.x + (1 - alpha) * (withGravity.x || 0);
        gravity.y = alpha * gravity.y + (1 - alpha) * (withGravity.y || 0);
        gravity.z = alpha * gravity.z + (1 - alpha) * (withGravity.z || 0);
        return {
          x: (withGravity.x || 0) - gravity.x,
          y: (withGravity.y || 0) - gravity.y,
          z: (withGravity.z || 0) - gravity.z
        };
      }

      function toScreenVector(acceleration) {
        const angle = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
        const motionX = acceleration.x;
        const motionY = -acceleration.y;
        return {
          x: motionX * Math.cos(angle) - motionY * Math.sin(angle),
          y: motionX * Math.sin(angle) + motionY * Math.cos(angle),
          z: acceleration.z
        };
      }

      function handleMotion(event) {
        const acceleration = normalizeMotion(event);
        if (!acceleration) return;
        const now = performance.now();
        const measured = toScreenVector(acceleration);

        if (motionSamples < 10) {
          motionBias.x += measured.x / 10;
          motionBias.y += measured.y / 10;
          motionBias.z += measured.z / 10;
          motionSamples += 1;
          previousAcceleration = { x: 0, y: 0, z: 0 };
          lastMotionTime = now;
          return;
        }

        const corrected = {
          x: measured.x - motionBias.x,
          y: measured.y - motionBias.y,
          z: measured.z - motionBias.z
        };

        const sampleDt = clamp((now - lastMotionTime) / 1000, .008, .05);
        const smoothing = 1 - Math.exp(-sampleDt * 34);
        const screenAcceleration = {
          x: previousAcceleration.x + (corrected.x - previousAcceleration.x) * smoothing,
          y: previousAcceleration.y + (corrected.y - previousAcceleration.y) * smoothing,
          z: previousAcceleration.z + (corrected.z - previousAcceleration.z) * smoothing
        };
        const deltaX = screenAcceleration.x - previousAcceleration.x;
        const deltaY = screenAcceleration.y - previousAcceleration.y;
        const deltaZ = screenAcceleration.z - previousAcceleration.z;
        const jerk = Math.hypot(deltaX, deltaY, deltaZ);
        const accelerationStrength = Math.hypot(screenAcceleration.x, screenAcceleration.y);
        previousAcceleration = screenAcceleration;
        lastMotionTime = now;

        if (state === 'armed' && accelerationStrength < .55) {
          motionBias.x += (measured.x - motionBias.x) * .018;
          motionBias.y += (measured.y - motionBias.y) * .018;
          motionBias.z += (measured.z - motionBias.z) * .018;
        }

        const removeNoise = value => Math.abs(value) < .12 ? 0 : Math.sign(value) * (Math.abs(value) - .12);
        sensorForce.x = clamp(removeNoise(screenAcceleration.x), -24, 24);
        sensorForce.y = clamp(removeNoise(screenAcceleration.y), -24, 24);

        if (state === 'armed' && (accelerationStrength > 1.55 || jerk > 2.2)) {
          beginRun();
        }
      }

      function startPointerControl(event) {
        if (state === 'idle') {
          showToast('先点“开启摇一摇”');
          return;
        }
        if (state === 'revealing' || state === 'result') return;
        if (state === 'armed') beginRun();

        pointer.active = true;
        pointer.id = event.pointerId;
        pointer.lastX = event.clientX;
        pointer.lastY = event.clientY;
        pointer.lastTime = performance.now();
        body.vx = 0;
        body.vy = 0;
        movingBox.classList.add('dragging');
        try { movingBox.setPointerCapture?.(event.pointerId); } catch (error) {}
      }

      function moveWithPointer(event) {
        if (!pointer.active || pointer.id !== event.pointerId || state !== 'running') return;
        const now = performance.now();
        const dt = clamp((now - pointer.lastTime) / 1000, .008, .05);
        const dx = event.clientX - pointer.lastX;
        const dy = event.clientY - pointer.lastY;
        const area = arenaSize();
        const box = boxSize();

        body.vx = clamp(dx / dt, -MOTION.maxSpeed, MOTION.maxSpeed);
        body.vy = clamp(dy / dt, -MOTION.maxSpeed, MOTION.maxSpeed);
        body.x = clamp(body.x + dx, -2, Math.max(0, area.width - box.width) + 2);
        body.y = clamp(body.y + dy, -2, Math.max(0, area.height - box.height) + 2);
        distanceSinceImpact += Math.hypot(dx, dy);
        rotation = clamp(body.vx * .006, -12, 12);
        paintBox();

        pointer.lastX = event.clientX;
        pointer.lastY = event.clientY;
        pointer.lastTime = now;
      }

      function stopPointerControl(event) {
        if (!pointer.active || pointer.id !== event.pointerId) return;
        pointer.active = false;
        pointer.id = null;
        movingBox.classList.remove('dragging');
        try { movingBox.releasePointerCapture?.(event.pointerId); } catch (error) {}
        if (Math.hypot(body.vx, body.vy) < 135) {
          setStatus(`摇动中 · ${hitCount}/${targetHits}`);
          hint.textContent = '再快速甩向边缘；盒子不会自己改变方向';
        }
      }

      async function attachMotion() {
        if (motionAttached) return true;
        if (!window.isSecureContext) {
          showToast('动作感应需要 HTTPS 安全网址');
          return false;
        }

        if (typeof DeviceMotionEvent === 'undefined') return false;

        try {
          if (typeof DeviceMotionEvent.requestPermission === 'function') {
            const permission = await DeviceMotionEvent.requestPermission();
            if (permission !== 'granted') {
              showToast('没有动作权限，可拖动盒子体验真实惯性');
              return false;
            }
          }
          window.addEventListener('devicemotion', handleMotion, { passive: true });
          motionAttached = true;
          return true;
        } catch (error) {
          return false;
        }
      }

      async function arm() {
        ensureAudio();
        if (state === 'running' || state === 'revealing') return;

        startButton.disabled = true;
        startButton.textContent = '正在开启…';
        const enabled = await attachMotion();

        if (enabled) {
          motionSamples = 0;
          gravityReady = false;
          motionBias = { x: 0, y: 0, z: 0 };
          sensorForce = { x: 0, y: 0 };
          centerBox();
          beginSettle();
          return;
        }

        state = 'armed';
        startButton.disabled = false;
        startButton.textContent = '拖动盒子体验';
        hint.textContent = '按住盒子快速甩向边缘，轨迹完全来自你的手指';
      }

      function reset() {
        cancelAnimationFrame(animationFrame);
        state = motionAttached ? 'armed' : 'idle';
        pointer.active = false;
        pointer.id = null;
        movingBox.classList.remove('dragging');
        sensorForce = { x: 0, y: 0 };
        previousAcceleration = { x: 0, y: 0, z: 0 };
        motionBias = { x: 0, y: 0, z: 0 };
        gravityReady = false;
        wallContact = { left: false, right: false, top: false, bottom: false };
        motionSamples = 0;
        lastMotionTime = 0;
        distanceSinceImpact = 0;
        targetHits = 0;
        hitCount = 0;
        renderDots();
        resultScreen.classList.remove('show');
        resultScreen.style.display = 'none';
        app.classList.remove('result-mode');
        shakeScreen.hidden = false;
        centerBox();
        if (motionAttached) {
          beginSettle();
        } else {
          setStatus('准备摇盒');
          startButton.textContent = '开启摇一摇';
          hint.textContent = '点击允许动作感应，然后拿起手机快速摇动';
        }
      }

      startButton.addEventListener('click', async () => {
        if (state === 'idle') {
          await arm();
          return;
        }
        if (state === 'armed') {
          showToast(motionAttached ? '落底已完成，现在摇到边缘才会继续计数' : '请按住盒子，快速甩向屏幕边缘');
        }
      });

      movingBox.addEventListener('pointerdown', startPointerControl);
      movingBox.addEventListener('pointermove', moveWithPointer);
      movingBox.addEventListener('pointerup', stopPointerControl);
      movingBox.addEventListener('pointercancel', stopPointerControl);

      againButton.addEventListener('click', reset);
      backButton.addEventListener('click', () => {
        if (state === 'result') reset();
        else if (history.length > 1) history.back();
        else showToast('已经是第一页');
      });

      window.addEventListener('resize', () => {
        if (state !== 'running' && state !== 'revealing') centerBox();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && hasVibration) navigator.vibrate(0);
      });

      requestAnimationFrame(centerBox);
    })();
  </script>
</body>
</html>
